<div class="wrap">
  <h1>📝 글자수 카운터</h1>
  <p class="subtitle">실시간 글자·단어·문장·단락·읽기시간 계산</p>

  <textarea id="txt" placeholder="여기에 텍스트를 붙여넣으세요..."></textarea>

  <div class="stats-grid">
    <div class="stat-card highlight">
      <div class="stat-num" id="chars">0</div>
      <div class="stat-label">글자 수 (공백 포함)</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="charsNoSpace">0</div>
      <div class="stat-label">글자 수 (공백 제외)</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="words">0</div>
      <div class="stat-label">단어 수</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="sentences">0</div>
      <div class="stat-label">문장 수</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="paragraphs">0</div>
      <div class="stat-label">단락 수</div>
    </div>
    <div class="stat-card reading">
      <div class="stat-num" id="readTime">0초</div>
      <div class="stat-label">읽기 시간 (200wpm)</div>
    </div>
  </div>

  <div class="extra-row">
    <div class="extra-chip">줄 수: <strong id="lines">0</strong></div>
    <div class="extra-chip">바이트: <strong id="bytes">0</strong></div>
    <div class="extra-chip">한국어 음절: <strong id="korean">0</strong></div>
  </div>

  <button class="clear-btn" onclick="document.getElementById('txt').value='';update()">지우기</button>
</div>

<script>
function update() {
  const t = document.getElementById('txt').value;
  const words = t.trim() ? t.trim().split(/\s+/).length : 0;
  const sentences = t.trim() ? (t.match(/[.!?。！？]+/g) || []).length || 1 : 0;
  const paragraphs = t.trim() ? t.split(/\n\s*\n/).filter(p => p.trim()).length || 1 : 0;
  const lines = t.length ? t.split('\n').length : 0;
  const bytes = new Blob([t]).size;
  const korean = (t.match(/[\uac00-\ud7a3]/g) || []).length;

  const mins = words / 200;
  let readTime;
  if (mins < 1/60) readTime = '0초';
  else if (mins < 1) readTime = Math.round(mins * 60) + '초';
  else if (mins < 60) readTime = Math.round(mins) + '분';
  else readTime = Math.floor(mins/60) + '시간 ' + Math.round(mins%60) + '분';

  document.getElementById('chars').textContent = t.length.toLocaleString();
  document.getElementById('charsNoSpace').textContent = t.replace(/\s/g,'').length.toLocaleString();
  document.getElementById('words').textContent = words.toLocaleString();
  document.getElementById('sentences').textContent = sentences.toLocaleString();
  document.getElementById('paragraphs').textContent = paragraphs.toLocaleString();
  document.getElementById('readTime').textContent = readTime;
  document.getElementById('lines').textContent = lines.toLocaleString();
  document.getElementById('bytes').textContent = bytes.toLocaleString();
  document.getElementById('korean').textContent = korean.toLocaleString();
}
document.getElementById('txt').addEventListener('input', update);
</script>
