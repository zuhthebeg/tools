      <div class="stat"><b id="lines">0</b><span data-i18n="sLines">줄</span></div>

<script>
(() => {
  const T = I18n.t;
  I18n.define({
    pageTitle: ['글자수 세기 · 자소서 글자수 · 바이트 계산 — tool.cocy.io', 'Character Counter · Word & Byte Count — tool.cocy.io', '字数统计 · 字符与字节计算 — tool.cocy.io', '字數統計 · 字元與位元組計算 — tool.cocy.io', 'Contador de caracteres · Palabras y bytes — tool.cocy.io'],
    h1: ['글자수 세기', 'Character Counter', '字数统计', '字數統計', 'Contador de caracteres'],
    sub: ['자소서·SNS 글자수 제한 체크 · 공백/바이트 계산 · 입력 내용은 이 브라우저에만 자동 저장', 'Check length limits for essays and social posts · spaces/bytes · text is auto-saved only in this browser', '检查文书与社交平台字数限制 · 空格/字节计算 · 内容仅自动保存在此浏览器', '檢查文書與社群平台字數限制 · 空格/位元組計算 · 內容僅自動儲存在此瀏覽器', 'Comprueba límites para redacciones y redes sociales · espacios/bytes · el texto se guarda solo en este navegador'],
    ph: ['여기에 텍스트를 입력하거나 붙여넣으세요...', 'Type or paste your text here...', '在此输入或粘贴文本...', '在此輸入或貼上文字...', 'Escribe o pega tu texto aquí...'],
    limit: ['제한', 'Limit', '限制', '限制', 'Límite'],
    gNone: ['없음', 'None', '无', '無', 'Ninguno'],
    g500: ['자소서 500자', 'Essay 500 chars', '文书 500 字', '文書 500 字', 'Redacción 500 caracteres'],
    g700: ['자소서 700자', 'Essay 700 chars', '文书 700 字', '文書 700 字', 'Redacción 700 caracteres'],
    g1000: ['자소서 1,000자', 'Essay 1,000 chars', '文书 1,000 字', '文書 1,000 字', 'Redacción 1.000 caracteres'],
    g1500: ['자소서 1,500자', 'Essay 1,500 chars', '文书 1,500 字', '文書 1,500 字', 'Redacción 1.500 caracteres'],
    g2000: ['자소서 2,000자', 'Essay 2,000 chars', '文书 2,000 字', '文書 2,000 字', 'Redacción 2.000 caracteres'],
    gX: ['X(트위터) 280자', 'X (Twitter) 280 chars', 'X（推特）280 字', 'X（推特）280 字', 'X (Twitter) 280 caracteres'],
    gIg: ['인스타그램 캡션 2,200자', 'Instagram caption 2,200 chars', 'Instagram 文案 2,200 字', 'Instagram 文案 2,200 字', 'Pie de Instagram 2.200 caracteres'],
    gSms: ['문자(SMS) 90바이트', 'Korean SMS 90 bytes', '韩国短信 90 字节', '韓國簡訊 90 位元組', 'SMS coreano 90 bytes'],
    gCustom: ['직접 입력', 'Custom', '自定义', '自訂', 'Personalizado'],
    customPh: ['글자수', 'Length', '字数', '字數', 'Longitud'],
    bWith: ['공백 포함', 'With spaces', '含空格', '含空格', 'Con espacios'],
    bWithout: ['공백 제외', 'No spaces', '不含空格', '不含空格', 'Sin espacios'],
    bByte: ['바이트', 'Bytes', '字节', '位元組', 'Bytes'],
    clickCopy: ['클릭하면 복사', 'Click to copy', '点击复制', '點擊複製', 'Clic para copiar'],
    sChars: ['글자 (공백 포함)', 'Characters (with spaces)', '字符（含空格）', '字元（含空格）', 'Caracteres (con espacios)'],
    sNoSpace: ['글자 (공백 제외)', 'Characters (no spaces)', '字符（不含空格）', '字元（不含空格）', 'Caracteres (sin espacios)'],
    sBytesKr: ['바이트 (한글 2·영문 1)', 'Bytes (CJK 2 · ASCII 1)', '字节（中日韩 2 · 英文 1）', '位元組（中日韓 2 · 英文 1）', 'Bytes (CJK 2 · ASCII 1)'],
    sBytes: ['바이트 (UTF-8)', 'Bytes (UTF-8)', '字节（UTF-8）', '位元組（UTF-8）', 'Bytes (UTF-8)'],
    sWords: ['단어', 'Words', '单词', '單字', 'Palabras'],
    sSentences: ['문장', 'Sentences', '句子', '句子', 'Oraciones'],
    sParagraphs: ['단락', 'Paragraphs', '段落', '段落', 'Párrafos'],
    sLines: ['줄', 'Lines', '行', '行', 'Líneas'],
    sRead: ['읽기 시간', 'Reading time', '阅读时间', '閱讀時間', 'Tiempo de lectura'],
    copy: ['텍스트 복사', 'Copy text', '复制文本', '複製文字', 'Copiar texto'],
    trim: ['공백 정리', 'Tidy spaces', '整理空格', '整理空格', 'Limpiar espacios'],
    trimTip: ['연속 공백·줄바꿈 정리', 'Collapse repeated spaces and blank lines', '合并连续空格和空行', '合併連續空格和空行', 'Unir espacios repetidos y líneas vacías'],
    clear: ['지우기', 'Clear', '清空', '清除', 'Borrar'],
    sec: ['{s}초', '{s}s', '{s} 秒', '{s} 秒', '{s} s'],
    minSec: ['{m}분 {s}초', '{m}m {s}s', '{m} 分 {s} 秒', '{m} 分 {s} 秒', '{m} min {s} s'],
    uChar: ['자', ' chars', ' 字', ' 字', ' caracteres'],
    uByte: ['바이트', ' bytes', ' 字节', ' 位元組', ' bytes'],
    over: ['{n}{u} 초과', '{n}{u} over', '超出 {n}{u}', '超出 {n}{u}', '{n}{u} de más'],
    remain: ['{n}{u} 남음', '{n}{u} left', '剩余 {n}{u}', '剩餘 {n}{u}', 'quedan {n}{u}'],
    statCopied: ['{label}: {v} 복사', 'Copied {label}: {v}', '已复制 {label}：{v}', '已複製 {label}：{v}', 'Copiado {label}: {v}'],
    saveFail: ['글이 너무 길어 자동 저장하지 못했어요. 새로고침하면 사라질 수 있어요', 'Too long to autosave — the text may be lost on reload', '文本过长，无法自动保存，刷新后可能丢失', '文字過長，無法自動儲存，重新整理後可能遺失', 'Demasiado largo para guardar automáticamente; podría perderse al recargar'],
    confirmClear: ['입력한 내용을 지울까요?', 'Clear the text?', '清空文本吗？', '清除文字嗎？', '¿Borrar el texto?'],
  });
  I18n.init();

  const $ = (id) => document.getElementById(id);
  const txt = $('txt');
  const KEY = 'count_tool_v2';
  let basis = 'with', saveFailed = false;
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || '{}');
    if (typeof s.text === 'string') txt.value = s.text;
    if (s.goal) $('goalSel').value = s.goal;
    if (s.custom) $('goalCustom').value = s.custom;
    if (s.basis) basis = s.basis;
  } catch (e) {}

  const seg = window.Intl && Intl.Segmenter ? new Intl.Segmenter('ko', { granularity: 'grapheme' }) : null;
  const len = (t) => { if (!seg) return [...t].length; let n = 0; for (const _ of seg.segment(t)) n++; return n; };
  const krBytes = (t) => { let n = 0; for (const ch of t) { const c = ch.codePointAt(0); n += c === 10 ? 1 : c < 128 ? 1 : 2; } return n; };

  function update() {
    const t = txt.value;
    const trimmed = t.trim();
    const v = {
      chars: len(t),
      noSpace: len(t.replace(/\s/g, '')),
      bytesKr: krBytes(t),
      bytes: new TextEncoder().encode(t).length,
      words: trimmed ? trimmed.split(/\s+/).length : 0,
      sentences: trimmed ? (trimmed.match(/[^.!?。！？\n]+([.!?。！？]+|$)/gm) || []).filter((s) => s.trim()).length : 0,
      paragraphs: trimmed ? t.split(/\n\s*\n/).filter((p) => p.trim()).length : 0,
      lines: t ? t.split('\n').length : 0,
    };
    const secs = Math.round((v.noSpace / 500) * 60);
    v.readTime = secs < 60 ? T('sec', { s: secs }) : T('minSec', { m: Math.floor(secs / 60), s: secs % 60 });
    for (const k in v) $(k).textContent = typeof v[k] === 'number' ? v[k].toLocaleString() : v[k];

    const g = $('goalSel').value;
    $('goalCustom').hidden = g !== 'custom';
    let goal = g === 'custom' ? +$('goalCustom').value || 0 : +g;
    let b = basis;
    if (g === '90') b = 'byte';
    const cur = b === 'byte' ? v.bytesKr : b === 'without' ? v.noSpace : v.chars;
    const u = T(b === 'byte' ? 'uByte' : 'uChar');
    if (goal > 0) {
      const pct = Math.min(100, (cur / goal) * 100);
      $('bar').style.width = pct + '%';
      $('bar').classList.toggle('over', cur > goal);
      $('goalTxt').innerHTML = cur > goal
        ? `<span class="err">${T('over', { n: (cur - goal).toLocaleString(), u })}</span> · ${cur.toLocaleString()} / ${goal.toLocaleString()}${u}`
        : `${cur.toLocaleString()} / ${goal.toLocaleString()}${u} · ${T('remain', { n: (goal - cur).toLocaleString(), u })} (${pct.toFixed(0)}%)`;
    } else {
      $('bar').style.width = '0'; $('goalTxt').textContent = '';
    }
    $('basisSeg').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x.dataset.b === b));
    try {
      localStorage.setItem(KEY, JSON.stringify({ text: t, goal: g, custom: $('goalCustom').value, basis }));
      saveFailed = false;
    } catch (e) {
      if (!saveFailed) UI.toast(T('saveFail'));
      saveFailed = true;
    }
  }

  txt.addEventListener('input', update);
  $('goalSel').addEventListener('change', update);
  $('goalCustom').addEventListener('input', update);
  $('basisSeg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { basis = b.dataset.b; update(); } });
  document.querySelectorAll('.stat').forEach((el) => el.addEventListener('click', () => UI.copy(el.querySelector('b').textContent, T('statCopied', { label: el.querySelector('span').textContent, v: el.querySelector('b').textContent }))));
  $('copyBtn').addEventListener('click', () => txt.value && UI.copy(txt.value));
  $('trimBtn').addEventListener('click', () => { txt.value = txt.value.replace(/[ \t]+/g, ' ').replace(/ *\n */g, '\n').replace(/\n{3,}/g, '\n\n').trim(); update(); });
  $('clearBtn').addEventListener('click', () => { if (!txt.value || confirm(T('confirmClear'))) { txt.value = ''; update(); txt.focus(); } });
  document.addEventListener('i18n:change', update);
  update();
})();
</script>

  url: 'https://tool.cocy.io/count/'
});
</script>
