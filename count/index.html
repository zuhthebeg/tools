<div class="wrap">
  <div class="hero">
    <h1>📝 글자수 세기</h1>
    <p>자소서·SNS 글자수 제한 체크 · 공백/바이트 계산 · 입력 내용은 이 브라우저에만 자동 저장</p>

      <div class="row">
        <label class="lbl" for="goalSel" style="margin:0">제한</label>
        <select id="goalSel" style="width:auto;flex:1 1 180px">
          <option value="0">없음</option>
          <option value="500">자소서 500자</option>
          <option value="700">자소서 700자</option>
          <option value="1000" selected>자소서 1,000자</option>
          <option value="1500">자소서 1,500자</option>
          <option value="2000">자소서 2,000자</option>
          <option value="280">X(트위터) 280자</option>
          <option value="2200">인스타그램 캡션 2,200자</option>
          <option value="90">문자(SMS) 90바이트</option>
          <option value="custom">직접 입력</option>
        </select>
        <input type="number" id="goalCustom" min="1" placeholder="글자수" style="width:110px" hidden>
        <div class="seg" id="basisSeg"><button data-b="with" class="on">공백 포함</button><button data-b="without">공백 제외</button><button data-b="byte">바이트</button></div>

    </div>

      <div class="stat hi" title="클릭하면 복사"><b id="chars">0</b><span>글자 (공백 포함)</span></div>
      <div class="stat"><b id="noSpace">0</b><span>글자 (공백 제외)</span></div>
      <div class="stat"><b id="bytesKr">0</b><span>바이트 (한글 2·영문 1)</span></div>
      <div class="stat"><b id="bytes">0</b><span>바이트 (UTF-8)</span></div>
      <div class="stat"><b id="words">0</b><span>단어</span></div>
      <div class="stat"><b id="sentences">0</b><span>문장</span></div>
      <div class="stat"><b id="paragraphs">0</b><span>단락</span></div>
      <div class="stat"><b id="lines">0</b><span>줄</span></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const txt = $('txt');
  const KEY = 'count_tool_v2';
  let basis = 'with';
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || '{}');
    if (typeof s.text === 'string') txt.value = s.text;
    if (s.goal) $('goalSel').value = s.goal;
    if (s.custom) $('goalCustom').value = s.custom;
    if (s.basis) basis = s.basis;
  } catch (e) {}

  const seg = window.Intl && Intl.Segmenter ? new Intl.Segmenter('ko', { granularity: 'grapheme' }) : null;
  const len = (t) => { if (!seg) return [...t].length; let n = 0; for (const _ of seg.segment(t)) n++; return n; };
  const krBytes = (t) => { let n = 0; for (const ch of t) { const c = ch.codePointAt(0); n += c === 10 ? 1 : c < 128 ? 1 : 2; } return n; };

  function update() {
    const t = txt.value;
    const trimmed = t.trim();
    const v = {
      chars: len(t),
      noSpace: len(t.replace(/\s/g, '')),
      bytesKr: krBytes(t),
      bytes: new TextEncoder().encode(t).length,
      words: trimmed ? trimmed.split(/\s+/).length : 0,
      sentences: trimmed ? (trimmed.match(/[^.!?。！？\n]+([.!?。！？]+|$)/gm) || []).filter((s) => s.trim()).length : 0,
      paragraphs: trimmed ? t.split(/\n\s*\n/).filter((p) => p.trim()).length : 0,
      lines: t ? t.split('\n').length : 0,
    };
    const secs = Math.round((v.noSpace / 500) * 60);
    v.readTime = secs < 60 ? `${secs}초` : `${Math.floor(secs / 60)}분 ${secs % 60}초`;
    for (const k in v) $(k).textContent = typeof v[k] === 'number' ? v[k].toLocaleString() : v[k];

    const g = $('goalSel').value;
    $('goalCustom').hidden = g !== 'custom';
    let goal = g === 'custom' ? +$('goalCustom').value || 0 : +g;
    let b = basis;
    if (g === '90') b = 'byte';
    const cur = b === 'byte' ? v.bytesKr : b === 'without' ? v.noSpace : v.chars;
    const unit = b === 'byte' ? '바이트' : '자';
    if (goal > 0) {
      const pct = Math.min(100, (cur / goal) * 100);
      $('bar').style.width = pct + '%';
      $('bar').classList.toggle('over', cur > goal);
      $('goalTxt').innerHTML = cur > goal
        ? `<span class="err">${(cur - goal).toLocaleString()}${unit} 초과</span> · ${cur.toLocaleString()} / ${goal.toLocaleString()}${unit}`
        : `${cur.toLocaleString()} / ${goal.toLocaleString()}${unit} · ${(goal - cur).toLocaleString()}${unit} 남음 (${pct.toFixed(0)}%)`;
    } else {
      $('bar').style.width = '0'; $('goalTxt').textContent = '';
    }
    $('basisSeg').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x.dataset.b === b));
    try { localStorage.setItem(KEY, JSON.stringify({ text: t.slice(0, 100000), goal: g, custom: $('goalCustom').value, basis })); } catch (e) {}
  }

  txt.addEventListener('input', update);
  $('goalSel').addEventListener('change', update);
  $('goalCustom').addEventListener('input', update);
  $('basisSeg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { basis = b.dataset.b; update(); } });
  document.querySelectorAll('.stat').forEach((el) => el.addEventListener('click', () => UI.copy(el.querySelector('b').textContent, `${el.querySelector('span').textContent}: ${el.querySelector('b').textContent} 복사`)));
  $('copyBtn').addEventListener('click', () => txt.value && UI.copy(txt.value));
  $('trimBtn').addEventListener('click', () => { txt.value = txt.value.replace(/[ \t]+/g, ' ').replace(/ *\n */g, '\n').replace(/\n{3,}/g, '\n\n').trim(); update(); });
  $('clearBtn').addEventListener('click', () => { if (!txt.value || confirm('입력한 내용을 지울까요?')) { txt.value = ''; update(); txt.focus(); } });
  update();
})();
</script>
