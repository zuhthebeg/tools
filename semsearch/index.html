  sq1: ['계정에 못 들어가요', "I can't get into my account", '我登不进账号', '我登不進帳號', 'No puedo entrar en mi cuenta'],
  sq2: ['돈은 언제 빠져나가나요?', 'When will I be billed?', '什么时候扣钱？', '什麼時候扣錢？', '¿Cuándo me cobran?'],
  sq3: ['실수로 지운 사진 되살리기', 'Get back photos I deleted by mistake', '找回误删的照片', '找回誤刪的照片', 'Recuperar fotos que borré sin querer'],
  sq4: ['도둑맞은 폰 보안', 'Stolen phone security', '手机被偷了怎么办', '手機被偷了怎麼辦', 'Me robaron el teléfono'],
});
I18n.init();

(function () {
  const $ = (id) => document.getElementById(id);
  const t = I18n.t;
  const MODELS = [
    { id: 'Xenova/paraphrase-multilingual-MiniLM-L12-v2', key: 'mPara', mb: 113, q: '', p: '', thr: 0.8 },
    { id: 'Xenova/multilingual-e5-small', key: 'mE5', mb: 113, q: 'query: ', p: 'passage: ', thr: 0.92 },
    { id: 'Xenova/all-MiniLM-L6-v2', key: 'mMini', mb: 23, q: '', p: '', thr: 0.75 },
  ];
  const MAX_CHUNKS = 5000, MAX_PAIRS_N = 2000, MAX_PAIRS_OUT = 200, MAX_FILE = 5 * 2 ** 20;
  let files = [], fseq = 0, worker = null, chain = Promise.resolve(), loadedKey = '';
  let index = null, dirty = true, indexP = null, lastStatus = null, last = null, mode = 'search';
  const cache = new Map();
  const model = () => MODELS.find((m) => m.id === $('model').value) || MODELS[0];
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function status(key, vars, cls) {
    lastStatus = key ? [key, vars, cls] : null;
    $('status').className = 'grow ' + (cls || 'muted');
    $('status').textContent = key ? t(key, vars) : '';
  }

  function renderModels() {
    const cur = $('model').value || localStorage.getItem('semsearch_model') || MODELS[0].id;
    $('model').innerHTML = MODELS.map((m) => `<option value="${m.id}">${t(m.key)} · ~${m.mb} MB</option>`).join('');
    $('model').value = MODELS.some((m) => m.id === cur) ? cur : MODELS[0].id;
  }
  function setThr() { $('thr').value = model().thr; $('thrV').textContent = model().thr.toFixed(2); }

  function renderChips() {
    $('docChips').innerHTML = files.map((f) => `<span class="chip" data-id="${f.id}"><span title="${esc(f.name)}">📄 ${esc(f.sample ? t('sampleName') : f.name)} · ${t('chunksN', { n: split(f.text).length })}</span><button data-rm="${f.id}" title="${t('remove')}" aria-label="${t('remove')}">×</button></span>`).join('');
    $('sampleQs').innerHTML = files.some((f) => f.sample)
      ? `<span class="muted" style="font-size:12px;align-self:center">${t('tryQ')}</span>` + ['sq1', 'sq2', 'sq3', 'sq4'].map((k) => `<span class="chip q" data-q="${esc(t(k))}">${esc(t(k))}</span>`).join('')
      : '';
  }

  const sentSeg = window.Intl && Intl.Segmenter ? new Intl.Segmenter(undefined, { granularity: 'sentence' }) : null;
  function split(text) {
    const how = $('split').value;
    let parts;
    if (how === 'para') parts = text.split(/\n\s*\n/).map((p) => p.replace(/\s*\n\s*/g, ' '));
    else if (how === 'line') parts = text.split(/\n/);
    else {
      parts = [];
      for (const line of text.split(/\n/)) {
        if (!line.trim()) continue;
        if (sentSeg) for (const s of sentSeg.segment(line)) parts.push(s.segment);
        else parts.push(...(line.match(/[^.!?。！？]+[.!?。！？]*["')\]」』]*\s*/g) || [line]));
      }
    }
    return parts.map((s) => s.trim()).filter((s) => s.length > 1);
  }

  function makeChunks() {
    const docs = [];
    const typed = $('docs').value;
    if (typed.trim()) docs.push({ name: t('typed'), text: typed, id: 0 });
    for (const f of files) docs.push(f);
    const chunks = [];
    for (const d of docs) split(d.text).forEach((text, i) => chunks.push({ doc: d.id, idx: i, text }));
    return chunks;
  }
  const docName = (id) => { if (!id) return t('typed'); const f = files.find((x) => x.id === id); return f ? (f.sample ? t('sampleName') : f.name) : '?'; };

  function call(msg, onEvent) {
    const run = () => new Promise((resolve, reject) => {
      if (!worker) { worker = new Worker('/semsearch/worker.js', { type: 'module' }); loadedKey = ''; }
      worker.onmessage = ({ data }) => {
        if (data.type === 'progress' || data.type === 'step') onEvent && onEvent(data);
        else if (data.type === 'error') reject(new Error(data.message));
        else resolve(data);
      };
      worker.onerror = (e) => reject(new Error(e.message || 'worker error'));
      worker.postMessage(msg);
    });
    const p = chain.then(run, run);
    chain = p.catch(() => {});
    return p;
  }

  const dl = {};
  function onLoadEvent({ p }) {
    if (p.status === 'progress' && p.file && p.total) {
      dl[p.file] = [p.loaded, p.total];
      const v = Object.values(dl), l = v.reduce((a, x) => a + x[0], 0), tot = v.reduce((a, x) => a + x[1], 0);
      $('bar').style.width = ((l / tot) * 100).toFixed(1) + '%';
      status('loading', { p: `${Math.round(l / 2 ** 20)} / ${Math.round(tot / 2 ** 20)} MB` });
    } else if (p.status === 'done' || p.status === 'ready') status('initModel');
  }

  async function ensureModel(m) {
    if (loadedKey === m.id && worker) return;
    for (const k in dl) delete dl[k];
    status('initModel');
    await call({ type: 'load', model: m.id, device: 'wasm', dtype: 'q8' }, onLoadEvent);
    loadedKey = m.id;
  }

  async function embed(m, texts, prefix, onStep) {
    const ck = (s) => m.id + '\n' + prefix + s;
    const need = [...new Set(texts.filter((s) => !cache.has(ck(s))))];
    if (need.length) {
      await ensureModel(m);
      const r = await call({ type: 'embed', texts: need.map((s) => prefix + s) }, onStep);
      need.forEach((s, i) => cache.set(ck(s), r.data.subarray(i * r.dim, (i + 1) * r.dim)));
    }
    return texts.map((s) => cache.get(ck(s)));
  }

  async function build() {
    dirty = false;
    let chunks = makeChunks();
    if (!chunks.length) { index = null; status('noText', null, 'err'); return; }
    const capped = chunks.length > MAX_CHUNKS;
    if (capped) chunks = chunks.slice(0, MAX_CHUNKS);
    const m = model(), t0 = performance.now();
    $('indexBtn').disabled = true;
    try {
      const vecs = await embed(m, chunks.map((c) => c.text), m.p, (d) => {
        $('bar').style.width = ((d.done / d.total) * 100).toFixed(1) + '%';
        status('embedding', { done: d.done, total: d.total });
      });
      index = { chunks, vecs, model: m };
      $('bar').style.width = '100%';
      if (capped) status('tooMany', { n: MAX_CHUNKS }, 'err');
      else status('indexed', { n: chunks.length, sec: ((performance.now() - t0) / 1000).toFixed(1) });
    } catch (e) {
      index = null;
      dirty = true;
      status('failed', { msg: e.message }, 'err');
      if (worker) { worker.terminate(); worker = null; loadedKey = ''; }
      throw e;
    } finally {
      $('indexBtn').disabled = false;
    }
  }

  async function ensureIndex() {
    for (;;) {
      if (indexP) { await indexP; continue; }
      if (!dirty) return !!index;
      indexP = build().finally(() => { indexP = null; });
      await indexP;
    }
  }

  const dot = (a, b) => { let s = 0; for (let i = 0; i < a.length; i++) s += a[i] * b[i]; return s; };
  const terms = (q) => [...new Set(q.toLowerCase().split(/[\s.,!?;:'"()\[\]{}<>/\\。，！？、]+/).filter((w) => w.length > 1))];
  function hl(text, ws) {
    const s = esc(text);
    if (!ws.length) return s;
    const re = new RegExp('(' + ws.map((w) => esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
    return s.replace(re, '<mark>$1</mark>');
  }

  let searchSeq = 0;
  async function search() {
    const q = $('q').value.trim();
    if (!q) return;
    const my = ++searchSeq;
    try {
      if (!(await ensureIndex())) return;
      const t0 = performance.now(), ix = index;
      const [qv] = await embed(ix.model, [q], ix.model.q);
      if (my !== searchSeq || ix !== index) return;
      const k = +$('topk').value;
      const scored = ix.vecs.map((v, i) => [dot(qv, v), i]).sort((a, b) => b[0] - a[0]).slice(0, k);
      last = { type: 'search', q, ix, items: scored, ms: Math.round(performance.now() - t0), open: new Set() };
      renderResults();
    } catch (e) { /* status already shows the error */ }
  }

  async function findPairs() {
    try {
      if (!(await ensureIndex())) return;
      const ix = index, thr = +$('thr').value, n = Math.min(ix.vecs.length, MAX_PAIRS_N), out = [];
      for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
        if (ix.chunks[i].text === ix.chunks[j].text) { out.push([1, i, j]); continue; }
        const s = dot(ix.vecs[i], ix.vecs[j]);
        if (s >= thr) out.push([s, i, j]);
      }
      out.sort((a, b) => b[0] - a[0]);
      last = { type: 'pairs', ix, thr, n, capped: ix.vecs.length > n, total: out.length, items: out.slice(0, MAX_PAIRS_OUT) };
      renderResults();
    } catch (e) {}
  }

  function srcLabel(c) { return `${docName(c.doc)} · #${c.idx + 1}`; }
  function context(ix, i) {
    const c = ix.chunks[i], prev = ix.chunks[i - 1], next = ix.chunks[i + 1];
    const same = (x) => x && x.doc === c.doc;
    return [same(prev) ? `<div class="ctx">… ${esc(prev.text)}</div>` : '', same(next) ? `<div class="ctx" data-after>${esc(next.text)} …</div>` : ''];
  }

  function renderResults() {
    const box = $('results');
    if (!last || last.ix !== index) { box.innerHTML = ''; $('resHead').hidden = true; return; }
    const ix = last.ix;
    $('resHead').hidden = false;
    if (last.type === 'search') {
      const ws = terms(last.q), top = last.items.length ? Math.max(last.items[0][0], 1e-6) : 1;
      $('resInfo').textContent = t('resInfo', { q: last.q, n: last.items.length, ms: last.ms });
      box.innerHTML = last.items.map(([s, i], r) => {
        const c = ix.chunks[i], open = last.open.has(i), [pv, nx] = open ? context(ix, i) : ['', ''];
        return `<div class="res" data-i="${i}"><div class="top"><span class="score">${s.toFixed(2)}</span><span class="meter"><i style="width:${Math.max(4, (s / top) * 100).toFixed(0)}%"></i></span><span class="src">${r + 1}. ${esc(srcLabel(c))}</span><button class="cp" data-cp="${i}" title="${t('copyOne')}">📋</button></div>${pv}<div class="txt">${hl(c.text, ws)}</div>${nx}</div>`;
      }).join('');
    } else {
      $('resInfo').textContent = t('pairsInfo', { n: last.total, thr: last.thr.toFixed(2), m: last.n }) + (last.capped ? t('pairsCap', { n: last.n }) : '');
      box.innerHTML = last.items.length ? last.items.map(([s, i, j]) => `<div class="res pair"><div class="top"><span class="score">${s.toFixed(2)}</span><span class="src">${esc(srcLabel(ix.chunks[i]))} ↔ ${esc(srcLabel(ix.chunks[j]))}</span></div><div class="txt">${esc(ix.chunks[i].text)}</div><div class="txt">${esc(ix.chunks[j].text)}</div></div>`).join('')
        : `<p class="muted">${t('noPairs')}</p>`;
    }
  }

  function resultsText() {
    if (!last) return '';
    const ix = last.ix;
    if (last.type === 'search') return last.items.map(([s, i], r) => `${r + 1}. [${s.toFixed(2)}] ${ix.chunks[i].text} (${srcLabel(ix.chunks[i])})`).join('\n');
    return last.items.map(([s, i, j]) => `[${s.toFixed(2)}] ${ix.chunks[i].text}\n     ↔ ${ix.chunks[j].text}`).join('\n\n');
  }

  function markDirty() {
    dirty = true;
    if (last) { last = null; renderResults(); }
  }

  async function addFiles(list) {
    for (const f of list) {
      try {
        if (f.size > MAX_FILE) throw new Error('size');
        let text = await f.text();
        if (/\.html?$/i.test(f.name) || f.type === 'text/html') text = new DOMParser().parseFromString(text, 'text/html').body.innerText || '';
        if (/\u0000/.test(text.slice(0, 2000))) throw new Error('binary');
        files.push({ id: ++fseq, name: f.name, text });
      } catch (e) { UI.toast(t('badFile', { name: f.name })); }
    }
    renderChips();
    markDirty();
  }

  $('results').addEventListener('click', (e) => {
    const cp = e.target.closest('[data-cp]');
    if (cp) { UI.copy(last.ix.chunks[+cp.dataset.cp].text); return; }
    const res = e.target.closest('.res[data-i]');
    if (res && last && last.type === 'search' && !getSelection().toString()) {
      const i = +res.dataset.i;
      last.open.has(i) ? last.open.delete(i) : last.open.add(i);
      renderResults();
    }
  });
  $('docChips').addEventListener('click', (e) => {
    const b = e.target.closest('[data-rm]');
    if (!b) return;
    files = files.filter((f) => f.id !== +b.dataset.rm);
    renderChips();
    markDirty();
  });
  $('sampleQs').addEventListener('click', (e) => {
    const c = e.target.closest('[data-q]');
    if (!c) return;
    setMode('search');
    $('q').value = c.dataset.q;
    search();
  });

  const drop = $('drop');
  drop.addEventListener('click', () => $('file').click());
  $('file').addEventListener('change', (e) => { addFiles([...e.target.files]); e.target.value = ''; });
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); addFiles([...e.dataTransfer.files]); });

  $('docs').addEventListener('input', markDirty);
  $('split').addEventListener('change', () => { try { localStorage.setItem('semsearch_split', $('split').value); } catch (e) {} renderChips(); markDirty(); });
  $('model').addEventListener('change', () => { try { localStorage.setItem('semsearch_model', $('model').value); } catch (e) {} setThr(); markDirty(); });
  $('indexBtn').addEventListener('click', () => { dirty = true; ensureIndex().catch(() => {}); });
  $('sampleBtn').addEventListener('click', () => {
    files = files.filter((f) => !f.sample);
    files.unshift({ id: ++fseq, name: 'sample', text: t('sampleDoc'), sample: true });
    $('split').value = 'line';
    renderChips();
    markDirty();
    ensureIndex().catch(() => {});
  });
  $('goBtn').addEventListener('click', search);
  let deb;
  $('q').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { clearTimeout(deb); search(); } });
  $('q').addEventListener('input', () => { clearTimeout(deb); if (index && !dirty && $('q').value.trim().length > 1) deb = setTimeout(search, 450); });
  $('topk').addEventListener('change', () => { if (last && last.type === 'search') search(); });

  function setMode(m) {
    mode = m;
    $('modeSeg').querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.m === m));
    $('searchBox').hidden = m !== 'search';
    $('pairsBox').hidden = m !== 'pairs';
  }
  $('modeSeg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setMode(b.dataset.m); });
  $('thr').addEventListener('input', () => { $('thrV').textContent = (+$('thr').value).toFixed(2); });
  $('thr').addEventListener('change', () => { if (last && last.type === 'pairs') findPairs(); });
  $('pairsBtn').addEventListener('click', findPairs);
  $('copyAllBtn').addEventListener('click', () => UI.copy(resultsText()));

  document.addEventListener('i18n:change', () => {
    renderModels();
    const s = files.find((f) => f.sample);
    if (s && s.text !== t('sampleDoc')) { s.text = t('sampleDoc'); markDirty(); }
    renderChips();
    renderResults();
    if (lastStatus) status(...lastStatus);
  });

  try { const sp = localStorage.getItem('semsearch_split'); if (sp) $('split').value = sp; } catch (e) {}
  renderModels();
  setThr();
  renderChips();
})();
</script>
