(function () {
  const $ = (id) => document.getElementById(id);
  const t = I18n.t;
  const TESS = 'https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/tesseract.min.js';
  const LANGS = [
    ['kor', '한국어'], ['eng', 'English'], ['chi_sim', '简体中文'], ['chi_tra', '繁體中文'], ['jpn', '日本語'],
    ['spa', 'Español'], ['fra', 'Français'], ['deu', 'Deutsch'], ['por', 'Português'], ['ita', 'Italiano'],
    ['rus', 'Русский'], ['vie', 'Tiếng Việt'], ['tha', 'ไทย'], ['ara', 'العربية'], ['hin', 'हिन्दी'],
  ];
  const DEFAULT_LANGS = { ko: ['kor', 'eng'], en: ['eng'], 'zh-CN': ['chi_sim', 'eng'], 'zh-TW': ['chi_tra', 'eng'], es: ['spa', 'eng'] };
  const CJK = '\\u3040-\\u30ff\\u3400-\\u4dbf\\u4e00-\\u9fff\\uf900-\\ufaff\\u3000-\\u303f\\uff00-\\uffef';
  const CJK_GAP = new RegExp(`([${CJK}])\\s+(?=[${CJK}])`, 'g');

  let langs;
  try { langs = JSON.parse(localStorage.getItem('ocr_langs')); } catch (e) {}
  if (!Array.isArray(langs) || !langs.length || !langs.every((l) => LANGS.some((x) => x[0] === l))) langs = (DEFAULT_LANGS[I18n.lang] || ['eng']).slice();

  let items = [], seq = 0, busy = false, worker = null, workerLangs = '', job = null, lastStatus = null, gen = 0;

  function status(key, vars, cls) {
    lastStatus = key ? [key, vars, cls] : null;
    $('status').className = cls || 'muted';
    $('status').textContent = key ? t(key, vars) : '';
  }

  function renderLangs() {
    $('langs').innerHTML = LANGS.map(([c, n]) => `<button type="button" data-l="${c}" class="${langs.includes(c) ? 'on' : ''}">${n}</button>`).join('');
  }
  $('langs').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    const c = b.dataset.l;
    if (langs.includes(c)) {
      if (langs.length === 1) { UI.toast(t('needLang')); return; }
      langs = langs.filter((x) => x !== c);
    } else {
      if (langs.length >= 3) { UI.toast(t('maxLangs')); return; }
      langs.push(c);
    }
    try { localStorage.setItem('ocr_langs', JSON.stringify(langs)); } catch (e) {}
    renderLangs();
  });

  function loadScript(src) {
    return new Promise((res, rej) => {
      if (window.Tesseract) return res();
      const s = document.createElement('script');
      s.src = src; s.onload = res; s.onerror = () => rej(new Error('failed to load ' + src));
      document.head.appendChild(s);
    });
  }

  function onLog(m) {
    const p = typeof m.progress === 'number' ? m.progress : 0;
    if (/loading language/.test(m.status) || /loading tesseract core/.test(m.status) || /initializ/.test(m.status)) {
      $('bar').style.width = (p * 100).toFixed(0) + '%';
      status('loadLang', { p: Math.round(p * 100) + '%' });
    } else if (m.status === 'recognizing text' && job) {
      const frac = (job.n - 1 + p) / job.total;
      $('bar').style.width = (frac * 100).toFixed(1) + '%';
      status('reading', { n: job.n, total: job.total, p: Math.round(p * 100) + '%' });
    }
  }

  async function ensureWorker() {
    const key = langs.join('+');
    if (worker && workerLangs === key) return;
    status('loadEngine');
    await loadScript(TESS);
    if (!worker) worker = await Tesseract.createWorker(langs, 1, { logger: onLog });
    else await worker.reinitialize(langs, 1);
    workerLangs = key;
  }

  async function prepCanvas(file, enhance) {
    const bmp = await createImageBitmap(file);
    const max = Math.max(bmp.width, bmp.height);
    let scale = max > 4000 ? 4000 / max : 1;
    if (enhance && max < 1200) scale = Math.min(2.5, 1600 / max);
    const w = Math.max(1, Math.round(bmp.width * scale)), h = Math.max(1, Math.round(bmp.height * scale));
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d', { willReadFrequently: true });
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(bmp, 0, 0, w, h);
    const W = bmp.width, H = bmp.height;
    bmp.close && bmp.close();
    if (enhance) {
      const img = ctx.getImageData(0, 0, w, h), d = img.data, hist = new Uint32Array(256);
      for (let i = 0; i < d.length; i += 4) {
        const y = (d[i] * 299 + d[i + 1] * 587 + d[i + 2] * 114) / 1000 | 0;
        d[i] = y; hist[y]++;
      }
      const n = w * h;
      let lo = 0, hi = 255, acc = 0, sum = 0;
      for (let v = 0; v < 256; v++) sum += v * hist[v];
      while (lo < 255 && (acc += hist[lo]) < n * 0.01) lo++;
      acc = 0;
      while (hi > 0 && (acc += hist[hi]) < n * 0.01) hi--;
      const invert = sum / n < 110;
      const span = Math.max(1, hi - lo);
      for (let i = 0; i < d.length; i += 4) {
        let v = ((d[i] - lo) * 255) / span;
        v = v < 0 ? 0 : v > 255 ? 255 : v;
        if (invert) v = 255 - v;
        d[i] = d[i + 1] = d[i + 2] = v;
        d[i + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
    }
    return { cv, scale, W, H };
  }

  function buildText(lineGroups, merge) {
    const paras = lineGroups.map((ls) => {
      const parts = ls.map((l) => l.text.trim()).filter(Boolean);
      if (!merge) return parts.join('\n');
      return parts.reduce((a, s) => (!a ? s : /-$/.test(a) && /^[a-z]/.test(s) ? a.slice(0, -1) + s : new RegExp(`[${CJK}]$`).test(a) && new RegExp(`^[${CJK}]`).test(s) ? a + s : a + ' ' + s), '');
    }).filter(Boolean);
    return paras.join(merge ? '\n\n' : '\n').replace(CJK_GAP, '$1');
  }

  async function recognize(it, myGen) {
    const { cv, scale, W, H } = await prepCanvas(it.file, $('prep').checked);
    await worker.setParameters({ tessedit_pageseg_mode: $('psm').value, preserve_interword_spaces: '1' });
    const t0 = performance.now();
    const { data } = await worker.recognize(cv, {}, { text: true, blocks: true });
    if (myGen !== gen) return;
    const groups = [], lines = [];
    for (const b of data.blocks || []) for (const p of b.paragraphs || []) {
      const g = [];
      for (const l of p.lines || []) {
        const text = (l.text || '').replace(/\s+$/, '').replace(CJK_GAP, '$1');
        if (!text.trim()) continue;
        const bb = l.bbox;
        const line = { text, conf: l.confidence, x: bb.x0 / scale / W, y: bb.y0 / scale / H, w: (bb.x1 - bb.x0) / scale / W, h: (bb.y1 - bb.y0) / scale / H };
        g.push(line); lines.push(line);
      }
      if (g.length) groups.push(g);
    }
    Object.assign(it, { groups, lines, conf: Math.round(data.confidence || 0), ms: performance.now() - t0, state: 'done' });
    it.text = buildText(groups, $('merge').checked);
  }

  function esc(s) { return s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }

  function renderItem(it) {
    let el = $('it' + it.id);
    if (!el) {
      el = document.createElement('div');
      el.className = 'card'; el.id = 'it' + it.id;
      el.innerHTML = `<div class="ihead"><span class="name grow"></span><button class="btn sm" data-a="copy"></button><button class="btn sm" data-a="txt"></button><button class="btn sm" data-a="rm"></button></div>
        <div class="item"><div class="stage"><img alt=""></div><div><textarea spellcheck="false"></textarea><div class="meta"></div></div></div>`;
      el.querySelector('img').src = it.url;
      el.querySelector('textarea').addEventListener('input', (e) => { it.text = e.target.value; it.edited = true; });
      el.addEventListener('click', (e) => {
        const a = e.target.closest('[data-a]');
        const box = e.target.closest('.box');
        if (box) { const l = it.lines[+box.dataset.i]; UI.copy(l.text, t('lineCopied', { s: l.text.slice(0, 40) })); return; }
        if (!a) return;
        if (a.dataset.a === 'copy') UI.copy(it.text || '', t('copied'));
        else if (a.dataset.a === 'txt') download(baseName(it) + '.txt', it.text || '');
        else if (a.dataset.a === 'rm') removeItem(it);
      });
      $('list').appendChild(el);
    }
    el.querySelector('.name').textContent = it.file.name || 'image';
    el.querySelector('[data-a=copy]').textContent = t('copy');
    el.querySelector('[data-a=txt]').textContent = t('txt');
    el.querySelector('[data-a=rm]').textContent = t('remove');
    el.querySelector('[data-a=rm]').title = t('removeT');
    el.querySelector('[data-a=copy]').disabled = el.querySelector('[data-a=txt]').disabled = it.state !== 'done';
    const stage = el.querySelector('.stage');
    stage.classList.toggle('noboxes', !$('boxes').checked);
    stage.querySelectorAll('.box').forEach((b) => b.remove());
    (it.lines || []).forEach((l, i) => {
      const b = document.createElement('div');
      b.className = 'box ' + (l.conf >= 80 ? 'hi' : l.conf >= 60 ? 'mid' : 'lo');
      b.dataset.i = i; b.title = l.text;
      b.style.cssText = `left:${l.x * 100}%;top:${l.y * 100}%;width:${l.w * 100}%;height:${l.h * 100}%`;
      stage.appendChild(b);
    });
    const ta = el.querySelector('textarea');
    if (it.state === 'done') {
      if (document.activeElement !== ta) ta.value = it.text || '';
      ta.placeholder = t('noText');
      ta.readOnly = false;
      el.querySelector('.meta').innerHTML = `<span>${t('conf')} <b>${it.conf}%</b></span><span>${t('lines')} <b>${it.lines.length}</b></span><span>${t('chars')} <b>${(it.text || '').replace(/\s/g, '').length}</b></span><span>${t('time')} <b>${(it.ms / 1000).toFixed(1)}s</b></span>`;
    } else {
      ta.value = ''; ta.readOnly = true;
      ta.placeholder = it.state === 'err' ? t('failed', { msg: it.err }) : t('queued');
      el.querySelector('.meta').innerHTML = '';
    }
  }

  function renderAll() {
    items.forEach(renderItem);
    $('allRow').hidden = !items.length;
    $('rerunBtn').disabled = !items.length || busy;
  }

  function baseName(it) { return (it.file.name || 'image').replace(/\.[^.]+$/, ''); }
  function download(name, text) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
    a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  function allText() { return items.filter((x) => x.state === 'done').map((x) => (items.length > 1 ? `# ${x.file.name || 'image'}\n` : '') + x.text).join('\n\n'); }

  function removeItem(it) {
    items = items.filter((x) => x !== it);
    URL.revokeObjectURL(it.url);
    $('it' + it.id)?.remove();
    renderAll();
  }

  async function addFiles(list) {
    const imgs = [...list].filter((f) => f && /^image\//.test(f.type));
    if (!imgs.length) { status('badImg', null, 'err'); return; }
    for (const f of imgs) items.push({ id: ++seq, file: f, url: URL.createObjectURL(f), state: 'queued' });
    renderAll();
    runQueue();
  }

  async function runQueue(all) {
    if (busy) return;
    if (all) items.forEach((x) => { x.state = 'queued'; x.lines = []; x.edited = false; });
    const todo = items.filter((x) => x.state === 'queued');
    if (!todo.length) return;
    busy = true;
    const myGen = gen;
    renderAll();
    $('bar').style.width = '0';
    const t0 = performance.now();
    let n = 0;
    try {
      await ensureWorker();
      for (const it of todo) {
        if (myGen !== gen) return;
        if (!items.includes(it)) continue;
        job = { n: ++n, total: todo.length };
        try { await recognize(it, myGen); }
        catch (e) { it.state = 'err'; it.err = e.message || String(e); if (/createImageBitmap|decode|source/i.test(it.err)) it.err = t('badImg'); }
        renderItem(it);
      }
      if (myGen !== gen) return;
      $('bar').style.width = '100%';
      status('doneStat', { n, sec: ((performance.now() - t0) / 1000).toFixed(1) });
    } catch (e) {
      status('failed', { msg: e.message || String(e) }, 'err');
      todo.forEach((x) => { if (x.state === 'queued') { x.state = 'err'; x.err = e.message || String(e); } });
      try { worker && (await worker.terminate()); } catch (_) {}
      worker = null; workerLangs = '';
    } finally {
      job = null;
      if (myGen === gen) {
        busy = false;
        renderAll();
        if (items.some((x) => x.state === 'queued')) runQueue();
      }
    }
  }

  function reset() {
    gen++;
    if (busy && worker) { worker.terminate().catch(() => {}); worker = null; workerLangs = ''; }
    busy = false; job = null;
    items.forEach((x) => URL.revokeObjectURL(x.url));
    items = [];
    $('list').innerHTML = '';
    $('bar').style.width = '0';
    status(null);
    renderAll();
  }

  async function sample() {
    const cv = document.createElement('canvas');
    const lines = t('sampleText').split('\n');
    cv.width = 900; cv.height = 90 + lines.length * 70;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#fbfaf6'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = '#1f2937';
    lines.forEach((s, i) => {
      ctx.font = `${i === 0 ? 'bold 46px' : '40px'} "Noto Sans KR","Noto Sans CJK KR","Noto Sans CJK SC","Malgun Gothic","PingFang SC","Microsoft YaHei",sans-serif`;
      ctx.fillText(s, 48, 80 + i * 70);
    });
    const b = await new Promise((r) => cv.toBlob(r, 'image/png'));
    addFiles([new File([b], 'sample.png', { type: 'image/png' })]);
  }

  const drop = $('drop');
  drop.addEventListener('click', () => $('file').click());
  $('file').addEventListener('change', (e) => { addFiles(e.target.files); e.target.value = ''; });
  $('cam').addEventListener('change', (e) => { addFiles(e.target.files); e.target.value = ''; });
  $('camBtn').addEventListener('click', () => $('cam').click());
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); addFiles(e.dataTransfer.files); });
  document.addEventListener('paste', (e) => {
    if (e.target.closest && e.target.closest('textarea,input')) return;
    const fs = [...(e.clipboardData ? e.clipboardData.files : [])].filter((x) => x.type.startsWith('image/'));
    if (fs.length) addFiles(fs);
  });
  $('sampleBtn').addEventListener('click', sample);
  $('rerunBtn').addEventListener('click', () => runQueue(true));
  $('clearBtn').addEventListener('click', reset);
  $('copyAll').addEventListener('click', () => UI.copy(allText(), t('copied')));
  $('dlAll').addEventListener('click', () => download(items.length === 1 ? baseName(items[0]) + '.txt' : 'ocr.txt', allText()));
  $('boxes').addEventListener('change', renderAll);
  $('merge').addEventListener('change', () => { items.forEach((x) => { if (x.state === 'done' && !x.edited) x.text = buildText(x.groups, $('merge').checked); }); renderAll(); });
  document.addEventListener('i18n:change', () => { renderAll(); if (lastStatus) status(...lastStatus); });

  renderLangs();
  renderAll();
})();
</script>
