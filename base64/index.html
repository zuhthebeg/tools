<body>
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MV8KQGJF" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<div class="wrap">
  <div class="hero">
    <h1>🔐 Base64 인코더 / 디코더</h1>
    <p>입력 즉시 변환 · 한글(UTF-8) 지원 · 파일·이미지 ↔ Base64 — 파일은 업로드되지 않고 브라우저에서만 처리돼요</p>
  </div>
  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <div class="seg" id="dirSeg"><button data-dir="encode" class="on">인코딩</button><button data-dir="decode">디코딩</button></div>
      <label class="chk"><input type="checkbox" id="urlSafe"> URL-safe (-_ , 패딩 없음)</label>
    </div>
    <div class="io">
      <div><label class="lbl" for="input">입력</label><textarea id="input" class="mono" spellcheck="false" placeholder="변환할 텍스트를 입력하세요"></textarea></div>
      <div><label class="lbl" for="output">결과</label><textarea id="output" class="mono" readonly spellcheck="false"></textarea><div id="status" class="muted" style="margin-top:6px">&nbsp;</div></div>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn primary" id="copyBtn">결과 복사</button>
      <button class="btn" id="swapBtn">⇅ 결과를 입력으로</button>
      <button class="btn" id="dlBtn" hidden>⬇ 파일로 저장</button>
      <button class="btn danger" id="clearBtn">지우기</button>
    </div>
    <img id="decImg" hidden alt="디코딩된 이미지 미리보기">
  </div>
  <div class="card">
    <h2>파일 → Base64</h2>
    <label class="drop" id="drop"><input type="file" id="file">📁 파일을 끌어다 놓거나 클릭해서 선택 <span class="muted">(최대 20MB)</span></label>
    <div id="fileOut" hidden style="margin-top:12px">
      <div class="muted" id="fileInfo"></div>
      <img id="imgPrev" hidden alt="미리보기">
      <div class="row" style="margin-top:10px">
        <button class="btn primary" id="copyRaw">Base64 복사</button>
        <button class="btn" id="copyData">Data URL 복사</button>
        <button class="btn" id="copyCss" hidden>CSS background 복사</button>
        <button class="btn" id="copyImg" hidden>&lt;img&gt; 태그 복사</button>
      </div>
    </div>
  </div>

<script src="/lib/ui.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const input = $('input'), output = $('output'), status = $('status');
  let dir = 'encode', decodedBytes = null;

  const bytesToB64 = (bytes) => { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); };
  const b64ToBytes = (b64) => {
    let s = b64.replace(/^data:[^,]*,/, '').replace(/\s/g, '').replace(/-/g, '+').replace(/_/g, '/');
    if (s.length % 4 === 1) throw new Error('길이가 올바르지 않아요');
    s += '='.repeat((4 - (s.length % 4)) % 4);
    const bin = atob(s), out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  };
  const urlSafe = (b64) => ($('urlSafe').checked ? b64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '') : b64);
  const sniff = (b) => {
    const h = [...b.subarray(0, 12)].map((x) => x.toString(16).padStart(2, '0')).join('');
    if (h.startsWith('89504e47')) return ['image/png', 'png'];
    if (h.startsWith('ffd8ff')) return ['image/jpeg', 'jpg'];
    if (h.startsWith('47494638')) return ['image/gif', 'gif'];
    if (h.startsWith('52494646') && h.slice(16, 24) === '57454250') return ['image/webp', 'webp'];
    if (h.startsWith('25504446')) return ['application/pdf', 'pdf'];
    if (h.startsWith('504b0304')) return ['application/zip', 'zip'];
    return null;
  };

  function convert() {
    const t = input.value;
    status.className = 'muted';
    decodedBytes = null; $('dlBtn').hidden = true; $('decImg').hidden = true;
    if (!t) { output.value = ''; status.innerHTML = '&nbsp;'; return; }
    try {
      if (dir === 'encode') {
        output.value = urlSafe(bytesToB64(new TextEncoder().encode(t)));
        status.textContent = `${t.length.toLocaleString()}자 → ${output.value.length.toLocaleString()}자`;
      } else {
        const bytes = b64ToBytes(t);
        const type = sniff(bytes);
        let text = null;
        if (!type) { try { text = new TextDecoder('utf-8', { fatal: true }).decode(bytes); } catch (e) {} }
        if (text != null) { output.value = text; status.textContent = `${bytes.length.toLocaleString()} 바이트 · UTF-8 텍스트`; }
        else {
          decodedBytes = { bytes, type: type || ['application/octet-stream', 'bin'] };
          output.value = '';
          status.textContent = `${bytes.length.toLocaleString()} 바이트 · ${type ? type[0] : '바이너리'} — 텍스트가 아니라 파일로 저장할 수 있어요`;
          $('dlBtn').hidden = false;
          if (type && type[0].startsWith('image/')) { $('decImg').src = URL.createObjectURL(new Blob([bytes], { type: type[0] })); $('decImg').hidden = false; }
        }
      }
    } catch (e) {
      output.value = '';
      status.className = 'err';
      status.textContent = '올바른 Base64가 아니에요 (허용 문자: A-Z a-z 0-9 + / - _ =)';
    }
  }

  $('dirSeg').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    dir = b.dataset.dir;
    $('dirSeg').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
    input.placeholder = dir === 'encode' ? '변환할 텍스트를 입력하세요' : 'Base64 또는 data:...;base64, 문자열을 붙여넣으세요';
    convert();
  });
  input.addEventListener('input', convert);
  $('urlSafe').addEventListener('change', () => { convert(); if (fileB64) showFile(); });
  $('copyBtn').addEventListener('click', () => output.value && UI.copy(output.value));
  $('swapBtn').addEventListener('click', () => { if (!output.value) return; input.value = output.value; $('dirSeg').querySelector(`[data-dir=${dir === 'encode' ? 'decode' : 'encode'}]`).click(); });
  $('clearBtn').addEventListener('click', () => { input.value = ''; convert(); input.focus(); });
  $('dlBtn').addEventListener('click', () => {
    if (!decodedBytes) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([decodedBytes.bytes], { type: decodedBytes.type[0] }));
    a.download = 'decoded.' + decodedBytes.type[1];
    a.click();
  });

  let fileB64 = '', fileMeta = null;
  function showFile() {
    const raw = urlSafe(fileB64);
    const data = `data:${fileMeta.type || 'application/octet-stream'};base64,${fileB64}`;
    $('fileOut').hidden = false;
    $('fileInfo').textContent = `${fileMeta.name} · ${fileMeta.type || '알 수 없는 형식'} · ${fileMeta.size.toLocaleString()} 바이트 → Base64 ${raw.length.toLocaleString()}자`;
    const isImg = (fileMeta.type || '').startsWith('image/');
    $('imgPrev').hidden = !isImg; if (isImg) $('imgPrev').src = data;
    $('copyCss').hidden = $('copyImg').hidden = !isImg;
    $('copyRaw').onclick = () => UI.copy(raw);
    $('copyData').onclick = () => UI.copy(data, 'Data URL 복사');
    $('copyCss').onclick = () => UI.copy(`background-image: url("${data}");`);
    $('copyImg').onclick = () => UI.copy(`<img src="${data}" alt="">`);
  }
  async function handleFile(f) {
    if (!f) return;
    if (f.size > 20 * 1024 * 1024) { UI.toast('20MB 이하 파일만 변환할 수 있어요'); return; }
    fileB64 = bytesToB64(new Uint8Array(await f.arrayBuffer()));
    fileMeta = { name: f.name, type: f.type, size: f.size };
    showFile();
  }
  const drop = $('drop');
  $('file').addEventListener('change', (e) => handleFile(e.target.files[0]));
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); handleFile(e.dataTransfer.files[0]); });
  document.addEventListener('paste', (e) => { if (document.activeElement === input) return; const f = [...(e.clipboardData?.files || [])][0]; if (f) handleFile(f); });
  convert();
})();
</script>
