I18n.init();

(function () {
  const $ = (id) => document.getElementById(id);
  const t = I18n.t;
  const LANGS = ['ko', 'en', 'es', 'pt', 'fr'];
  const VOICES = ['F1', 'F2', 'F3', 'F4', 'F5', 'M1', 'M2', 'M3', 'M4', 'M5'];
  const SAMPLES = {
    ko: '안녕하세요. 이 목소리는 지금 여러분의 브라우저 안에서 만들어지고 있어요. 입력한 글은 어디에도 전송되지 않아요.',
    en: 'Hello! This voice is being generated right inside your browser. Nothing you type is ever sent to a server.',
    es: '¡Hola! Esta voz se está generando dentro de tu navegador. Nada de lo que escribes se envía a un servidor.',
    pt: 'Olá! Esta voz está sendo gerada dentro do seu navegador. Nada do que você digita é enviado a um servidor.',
    fr: 'Bonjour ! Cette voix est générée directement dans votre navigateur. Rien de ce que vous tapez n’est envoyé à un serveur.',
  };
  const UI_LANG = { ko: 'ko', en: 'en', es: 'es' };
  let gpu = false, worker = null, busy = false, gen = 0, lastStatus = null, wavBlob = null, audioUrl = null, wavName = '';

  const word = (w) => new RegExp(`(?<!\\p{L})(${w})(?!\\p{L})`, 'iu');
  const detect = (s) => /[\uac00-\ud7a3]/.test(s) ? 'ko'
    : /[ãõ]/.test(s) || word('você|não|obrigad[oa]|está|olá').test(s) ? 'pt'
    : /[ñ¿¡]/.test(s) || word('hola|gracias|qué|está|usted').test(s) ? 'es'
    : /[èêëàùœçé]/.test(s) || word('bonjour|merci|vous|est|une').test(s) ? 'fr' : 'en';
  const lang = () => $('lang').value === 'auto' ? detect($('text').value) : $('lang').value;

  function status(key, vars, cls) {
    lastStatus = key ? [key, vars, cls] : null;
    $('status').className = 'grow ' + (cls || 'muted');
    $('status').textContent = key ? t(key, vars) : '';
  }
  function render() {
    const cur = $('lang').value || 'auto';
    $('lang').innerHTML = `<option value="auto">${t('auto', { l: t(detect($('text').value)) })}</option>` + LANGS.map((l) => `<option value="${l}">${t(l)}</option>`).join('');
    $('lang').value = cur;
    let saved = null;
    try { saved = localStorage.getItem('tts_voice'); } catch (e) {}
    const v = $('voice').value || (VOICES.includes(saved) ? saved : 'F1');
    $('voice').innerHTML = VOICES.map((x) => `<option value="${x}">${t(x[0] === 'F' ? 'female' : 'male', { n: x[1] })}</option>`).join('');
    $('voice').value = v;
    const s = $('steps').value || '5';
    $('steps').innerHTML = [2, 5, 10, 20].map((n) => `<option value="${n}">${t('q' + n)}</option>`).join('');
    $('steps').value = s;
    $('speedV').textContent = '×' + Number($('speed').value).toFixed(2);
    $('cnt').textContent = t('chars', { n: $('text').value.length.toLocaleString() });
    $('devInfo').textContent = gpu ? t('devGpu') : t('devCpu');
  }

  function split(text) {
    const parts = text.replace(/\r/g, '').split(/(?<=[.!?。！？…])\s+|\n+/).map((s) => s.trim()).filter(Boolean);
    const out = [];
    for (let p of parts) {
      while (p.length > 300) {
        let cut = Math.max(p.lastIndexOf(', ', 300), p.lastIndexOf(' ', 300));
        if (cut < 100) cut = 300;
        out.push(p.slice(0, cut).trim()); p = p.slice(cut).trim();
      }
      if (!p) continue;
      if (out.length && out[out.length - 1].length + p.length < 120) out[out.length - 1] += ' ' + p;
      else out.push(p);
    }
    return out;
  }

  function wav(chunks, sr) {
    const gap = Math.round(sr * 0.18);
    const n = chunks.reduce((a, c) => a + c.length, 0) + gap * Math.max(0, chunks.length - 1);
    const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    str(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    str(36, 'data'); v.setUint32(40, n * 2, true);
    let o = 44;
    chunks.forEach((c, i) => {
      if (i) o += gap * 2;
      for (let k = 0; k < c.length; k++, o += 2) { const x = Math.max(-1, Math.min(1, c[k])); v.setInt16(o, x < 0 ? x * 0x8000 : x * 0x7fff, true); }
    });
    return { blob: new Blob([buf], { type: 'audio/wav' }), sec: n / sr };
  }

  const dl = {};
  function onLoad(p) {
    if (p.status === 'progress' && p.file && p.total) {
      dl[p.file] = [p.loaded, p.total];
      const v = Object.values(dl), l = v.reduce((a, x) => a + x[0], 0), tot = v.reduce((a, x) => a + x[1], 0);
      $('bar').style.width = ((l / tot) * 100).toFixed(1) + '%';
      status('loading', { p: `${Math.round(l / 2 ** 20)} / ${Math.round(tot / 2 ** 20)} MB` });
    } else if (p.status === 'done' || p.status === 'ready') status('initModel');
  }

  async function run() {
    const text = $('text').value.trim();
    if (!text) { status('empty', null, 'err'); return; }
    if (busy) stop(true);
    const my = ++gen, chunks = split(text), pcm = [], runLang = lang(), runVoice = $('voice').value;
    let sr = 44100;
    busy = true;
    $('runBtn').disabled = true; $('stopBtn').hidden = false; $('bar').style.width = '0';
    if (!worker) worker = new Worker('/tts/worker.js', { type: 'module' });
    const w = worker;
    try {
      for (const k in dl) delete dl[k];
      status('initModel');
      const t0 = performance.now();
      await new Promise((resolve, reject) => {
        let loaded = false;
        w.onmessage = ({ data: d }) => {
          if (my !== gen) return;
          if (d.type === 'progress') onLoad(d.p);
          else if (d.type === 'ready' && !loaded) {
            loaded = true;
            $('bar').style.width = '0';
            status('working', { done: 0, total: chunks.length });
            w.postMessage({ type: 'run', chunks, lang: runLang, voice: runVoice, steps: +$('steps').value, speed: +$('speed').value });
          } else if (d.type === 'chunk') {
            sr = d.sr; pcm[d.i] = d.audio;
            $('bar').style.width = (((d.i + 1) / d.total) * 100).toFixed(1) + '%';
            status('working', { done: d.i + 1, total: d.total });
          } else if (d.type === 'done') resolve();
          else if (d.type === 'error') reject(new Error(d.message));
        };
        w.onerror = (e) => reject(new Error(e.message || 'worker error'));
        w.postMessage({ type: 'load', device: gpu ? 'webgpu' : 'wasm' });
      });
      if (my !== gen) return;
      const r = wav(pcm, sr);
      wavBlob = r.blob;
      wavName = `tts-${runLang}-${runVoice}.wav`;
      if (audioUrl) URL.revokeObjectURL(audioUrl);
      audioUrl = URL.createObjectURL(wavBlob);
      $('audio').src = audioUrl;
      $('outCard').hidden = false;
      $('dur').dataset.sec = r.sec.toFixed(1); $('dur').dataset.sr = sr;
      renderDur();
      $('audio').play().catch(() => {});
      status('doneStat', { sec: ((performance.now() - t0) / 1000).toFixed(1) });
    } catch (e) {
      if (my !== gen) return;
      status('failed', { msg: e.message }, 'err');
      if (worker) { worker.terminate(); worker = null; }
    } finally {
      if (my === gen) { busy = false; $('runBtn').disabled = false; $('stopBtn').hidden = true; }
    }
  }
  function renderDur() { const d = $('dur').dataset; if (d.sec) $('dur').textContent = t('durInfo', { sec: d.sec, sr: d.sr }); }

  function stop(silent) {
    gen++;
    if (worker) { worker.terminate(); worker = null; }
    busy = false;
    $('runBtn').disabled = false; $('stopBtn').hidden = true; $('bar').style.width = '0';
    if (!silent) status('stopped');
  }

  $('runBtn').addEventListener('click', run);
  $('stopBtn').addEventListener('click', () => stop(false));
  $('text').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) run(); });
  $('text').addEventListener('input', render);
  $('speed').addEventListener('input', render);
  $('voice').addEventListener('change', () => { try { localStorage.setItem('tts_voice', $('voice').value); } catch (e) {} });
  $('sampleBtn').addEventListener('click', () => {
    const l = $('lang').value !== 'auto' ? $('lang').value : UI_LANG[(I18n.lang || 'ko').slice(0, 2)] || 'en';
    $('text').value = SAMPLES[l];
    render();
  });
  $('wavBtn').addEventListener('click', () => {
    if (!wavBlob) return;
    const a = document.createElement('a');
    a.href = audioUrl; a.download = wavName; a.click();
  });
  document.addEventListener('i18n:change', () => { render(); renderDur(); if (lastStatus) status(...lastStatus); });

  render();
  (async () => {
    try {
      const ad = navigator.gpu && (await navigator.gpu.requestAdapter());
      if (ad && !(ad.isFallbackAdapter || (ad.info && ad.info.isFallbackAdapter))) gpu = true;
    } catch (e) {}
    render();
  })();
})();
</script>
