<!DOCTYPE html>
<html lang="ko">
<head>
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({"gtm.start":new Date().getTime(),event:"gtm.js"});var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!="dataLayer"?"&l="+l:"";j.async=true;j.src="https://www.googletagmanager.com/gtm.js?id="+i+dl;f.parentNode.insertBefore(j,f)})(window,document,"script","dataLayer","GTM-MV8KQGJF");</script>
    <meta charset="UTF-8">
    <meta name="naver-site-verification" content="eace15647130e531f7e481198835265aca90c2a3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>🔧 Tool Portal - tool.cocy.io</title>
    <link rel="icon" href="https://cocy.io/favicon.ico">
    <style>
        :root {
            --primary: #3b82f6;
            --secondary: #06b6d4;
            --accent: #10b981;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --card-hover: #334155;
            --text: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #334155;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            padding: 1.5rem;
            text-align: center;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .header p {
            font-size: 0.9rem;
            opacity: 0.9;
            margin-top: 0.25rem;
        }

        /* Category Tabs */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 1rem;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .tab {
            padding: 8px 16px;
            border-radius: 20px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .tab:hover { border-color: var(--primary); color: var(--text); }
        .tab.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        /* Grid */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        .section {
            margin-bottom: 1.6rem;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 0.7rem;
            color: var(--accent);
        }

        @media (min-width: 768px) {
            .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
        }

        /* Card */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            color: inherit;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            background: var(--card-hover);
        }

        .card-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 8px;
            object-fit: contain;
        }

        .card-title {
            font-size: 0.9rem;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 4px;
        }

        .card-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 8px;
            font-weight: 600;
        }

        .badge-new { background: #ec4899; }
        .badge-hot { background: #f59e0b; }
        .badge-tool { background: var(--primary); }
        .badge-dev { background: #6b7280; }

        .card-desc {
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .footer a { color: var(--primary); text-decoration: none; }

        /* Search */
        .search-wrap { margin: 0.25rem 0 1.25rem; }
        .search {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            font-size: 1rem;
            outline: none;
        }
        .search:focus { border-color: var(--primary); }

        /* Empty state */
        .empty { 
            text-align: center; 
            padding: 3rem; 
            color: var(--text-secondary); 
        }
    </style>
</head>
<body>
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MV8KQGJF" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <header class="header">
        <h1>🔧 Tool Portal</h1>
        <p>설치·로그인 없이 브라우저에서 바로 쓰는 무료 도구 모음</p>
    </header>

    <div class="tabs">
        <button class="tab active" data-filter="all">전체</button>
        <button class="tab" data-filter="ai">🤖 AI</button>
        <button class="tab" data-filter="dev">🧪 개발·변환</button>
        <button class="tab" data-filter="network">🌐 네트워크</button>
        <button class="tab" data-filter="life">🗂️ 생활</button>
        <button class="tab" data-filter="fun">🎉 재미</button>
    </div>

    <div class="container">
        <div class="search-wrap">
            <input type="search" id="search" class="search" placeholder="도구 검색 (예: json, 토큰, 디데이)  ·  / 키로 바로 검색" autocomplete="off" aria-label="도구 검색">
        </div>
        <div id="sections"></div>
        <div class="empty" id="emptyState" style="display:none;">검색 결과가 없습니다</div>
    </div>

    <footer class="footer">
        <p>© 2025 <a href="https://cocy.io">COCY.IO</a> | <a href="https://game.cocy.io">🎮 Games</a></p>
    </footer>

    <script>
        let apps = [];
        let currentFilter = 'all';
        let query = '';

        const sectionLabels = {
            ai: '🤖 AI',
            dev: '🧪 개발·변환',
            network: '🌐 네트워크',
            life: '🗂️ 생활',
            fun: '🎉 재미',
            etc: '🛠️ 기타'
        };
        const sectionOrder = ['ai', 'dev', 'network', 'life', 'fun', 'etc'];

        function groupOf(app) {
            return sectionLabels[app.group] ? app.group : 'etc';
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function toCard(app) {
            return `
                <a href="${app.url}" class="card">
                    ${app.badge ? `<span class="card-badge badge-${app.badge.toLowerCase()}">${app.badge}</span>` : ''}
                    <img class="card-icon" src="${app.icon}" alt="" loading="lazy" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2280%22>🔧</text></svg>'">
                    <div class="card-title">${escapeHtml(app.title)}</div>
                    <div class="card-desc">${escapeHtml(app.desc)}</div>
                </a>
            `;
        }

        fetch('apps.json?' + Date.now())
            .then(r => r.json())
            .then(data => {
                apps = data.filter(a => {
                    const url = (a.url || '').toLowerCase();
                    return a.category !== 'game' && !url.includes('game.cocy.io');
                });
                renderApps();
            });

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentFilter = tab.dataset.filter;
                if (window.dataLayer) {
                    window.dataLayer.push({ event: 'tool_tab_click', tab: currentFilter });
                }
                renderApps();
            });
        });

        const searchEl = document.getElementById('search');
        searchEl.addEventListener('input', () => {
            query = searchEl.value.trim().toLowerCase();
            renderApps();
        });
        searchEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const first = document.querySelector('#sections .card');
                if (first) location.href = first.href;
            } else if (e.key === 'Escape') {
                searchEl.value = '';
                query = '';
                renderApps();
            }
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === '/' && document.activeElement !== searchEl) {
                e.preventDefault();
                searchEl.focus();
            }
        });

        function matches(app) {
            if (!query) return true;
            return [app.title, app.desc, app.url].join(' ').toLowerCase().includes(query);
        }

        function renderApps() {
            const sectionsEl = document.getElementById('sections');
            const empty = document.getElementById('emptyState');

            const grouped = {};
            apps.filter(matches).forEach(app => {
                const group = groupOf(app);
                if (currentFilter !== 'all' && currentFilter !== group) return;
                (grouped[group] = grouped[group] || []).push(app);
            });

            const visibleSections = sectionOrder
                .filter(key => grouped[key] && grouped[key].length)
                .map(key => ({ key, items: grouped[key] }));

            if (visibleSections.length === 0) {
                sectionsEl.innerHTML = '';
                empty.style.display = 'block';
                return;
            }

            empty.style.display = 'none';
            sectionsEl.innerHTML = visibleSections.map(section => `
                <section class="section">
                    <h2 class="section-title">${sectionLabels[section.key]}</h2>
                    <div class="grid">${section.items.map(toCard).join('')}</div>
                </section>
            `).join('');
        }
    </script>
    <script src="/lib/site-meta.js"></script>
    <script>
      SiteMeta.init({
        title: 'Tool Portal - tool.cocy.io',
        description: '실용적인 웹 도구 모음 포털',
        url: 'https://tool.cocy.io/'
      });
    </script>
</body>
</html>
