  micErr: ['마이크를 쓸 수 없어요', 'Microphone unavailable', '无法使用麦克风', '無法使用麥克風', 'Micrófono no disponible'],

  tip: ['처음 한 번은 모델을 내려받아요(수십~수백 MB). 다음부터는 브라우저 캐시에서 바로 불러와요. 내 기기 사양은', 'The model downloads once (tens to hundreds of MB), then loads from the browser cache. Check your device in the', '首次需下载模型（数十至数百 MB），之后从浏览器缓存加载。设备性能可在', '首次需下載模型（數十至數百 MB），之後從瀏覽器快取載入。裝置效能可在', 'El modelo se descarga una vez (decenas a cientos de MB) y luego se carga de la caché. Revisa tu dispositivo en el'],
  tipLink: ['AI 체커', 'AI Checker', 'AI 检测', 'AI 檢測', 'Comprobador de IA'],
  tipEnd: ['에서 확인해 보세요.', '.', '中查看。', '中查看。', '.'],
  allTools: ['모든 도구', 'All tools', '全部工具', '全部工具', 'Todas las herramientas'],
});
I18n.init();

(function () {
  const $ = (id) => document.getElementById(id);
  const t = I18n.t;
  const SR = 16000, WIN = 300;
  const MODELS = [
    { id: 'onnx-community/whisper-tiny', key: 'mTiny', cpu: 40, gpu: 115 },
    { id: 'onnx-community/whisper-base', key: 'mBase', cpu: 75, gpu: 195 },
    { id: 'onnx-community/whisper-small', key: 'mSmall', cpu: 240, gpu: 560 },
    { id: 'onnx-community/whisper-large-v3-turbo', key: 'mTurbo', cpu: 0, gpu: 1530, f16: true },
  ];
  const LANGS = [['', 'auto'], ['ko', '한국어'], ['en', 'English'], ['ja', '日本語'], ['zh', '中文'], ['es', 'Español'], ['fr', 'Français'], ['de', 'Deutsch'], ['ru', 'Русский'], ['pt', 'Português'], ['it', 'Italiano'], ['vi', 'Tiếng Việt'], ['th', 'ไทย'], ['id', 'Bahasa Indonesia'], ['ar', 'العربية'], ['hi', 'हिन्दी']];

  let gpu = { ok: false, f16: false }, audio = null, fileName = 'transcript', segs = [], worker = null, running = false, playerUrl = null;
  const pref = (() => { try { return JSON.parse(localStorage.getItem('stt_prefs')) || {}; } catch (e) { return {}; } })();
  const savePref = () => { try { localStorage.setItem('stt_prefs', JSON.stringify({ model: $('model').value, lang: $('lang').value, task: $('task').value, cpu: $('forceCpu').checked })); } catch (e) {} };
  const useGpu = () => gpu.ok && !$('forceCpu').checked;
  const fmtSize = (mb) => (mb >= 1000 ? (mb / 1000).toFixed(1) + ' GB' : mb + ' MB');

  function renderSelects() {
    const cur = $('model').value || pref.model || MODELS[1].id;
    $('model').innerHTML = MODELS.map((m) => {
      const ok = m.f16 ? useGpu() && gpu.f16 : true;
      const size = useGpu() ? m.gpu : m.cpu;
      return `<option value="${m.id}"${ok ? '' : ' disabled'}>${t(m.key)} · ${ok ? '~' + fmtSize(size) : t('needGpu')}</option>`;
    }).join('');
    const opt = [...$('model').options].find((o) => o.value === cur && !o.disabled);
    $('model').value = opt ? cur : MODELS[1].id;
    const curL = $('lang').value || pref.lang || '';
    $('lang').innerHTML = LANGS.map(([v, n]) => `<option value="${v}">${v ? n : t('auto')}</option>`).join('');
    $('lang').value = curL;
    $('devInfo').textContent = useGpu() ? t('devGpu') : t('devCpu');
    $('forceCpu').parentNode.hidden = !gpu.ok;
  }

  async function detectGpu() {
    try {
      const ad = navigator.gpu && (await navigator.gpu.requestAdapter());
      const fb = ad && (ad.isFallbackAdapter || (ad.info && ad.info.isFallbackAdapter));
      if (ad && !fb) gpu = { ok: true, f16: ad.features.has('shader-f16') };
    } catch (e) {}
  }

  async function loadFile(file, name) {
    $('status').className = 'muted';
    $('status').textContent = '';
    try {
      const buf = await file.arrayBuffer();
      const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SR });
      const ab = await ctx.decodeAudioData(buf);
      ctx.close();
      const ch = ab.numberOfChannels, len = ab.length, mono = new Float32Array(len);
      for (let c = 0; c < ch; c++) { const d = ab.getChannelData(c); for (let i = 0; i < len; i++) mono[i] += d[i] / ch; }
      audio = mono;
      fileName = (name || file.name || 'transcript').replace(/\.[^.]+$/, '') || 'transcript';
      if (playerUrl) URL.revokeObjectURL(playerUrl);
      playerUrl = URL.createObjectURL(file);
      $('player').src = playerUrl;
      $('player').hidden = false;
      $('fileInfo').textContent = `${name || file.name} · ${clock(len / SR)}`;
      $('runBtn').disabled = false;
    } catch (e) {
      audio = null;
      $('runBtn').disabled = true;
      $('status').className = 'err';
      $('status').textContent = t('decodeErr');
    }
  }

  const pad = (n, w = 2) => String(n).padStart(w, '0');
  function clock(s) { s = Math.max(0, s); const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = Math.floor(s % 60); return (h ? h + ':' + pad(m) : m) + ':' + pad(x); }
  function stamp(s, sep) { s = Math.max(0, s); const ms = Math.round(s * 1000); return `${pad(Math.floor(ms / 3600000))}:${pad(Math.floor(ms / 60000) % 60)}:${pad(Math.floor(ms / 1000) % 60)}${sep}${pad(ms % 1000, 3)}`; }

  function newWorker() {
    if (worker) worker.terminate();
    worker = new Worker('/stt/worker.js', { type: 'module' });
  }
  function call(msg, transfer, onProgress) {
    return new Promise((resolve, reject) => {
      worker.onmessage = ({ data }) => {
        if (data.type === 'progress') onProgress && onProgress(data.p);
        else if (data.type === 'error') reject(new Error(data.message));
        else resolve(data);
      };
      worker.onerror = (e) => reject(new Error(e.message || 'worker error'));
      worker.postMessage(msg, transfer || []);
    });
  }

  const files = {};
  function onLoadProgress(p) {
    if (p.status === 'progress' && p.file && p.total) {
      files[p.file] = [p.loaded, p.total];
      const v = Object.values(files), loaded = v.reduce((a, x) => a + x[0], 0), total = v.reduce((a, x) => a + x[1], 0);
      $('bar').style.width = ((loaded / total) * 100).toFixed(1) + '%';
      $('status').textContent = t('loading', { p: `${Math.round(loaded / 2 ** 20)} / ${Math.round(total / 2 ** 20)} MB` });
    } else if (p.status === 'done' || p.status === 'ready') {
      $('status').textContent = t('initModel');
    }
  }

  async function run() {
    if (!audio || running) return;
    running = true;
    $('runBtn').hidden = true; $('stopBtn').hidden = false;
    $('status').className = 'muted';
    $('bar').style.width = '0';
    segs = []; renderSegs();
    $('outCard').hidden = false;
    if (!worker) newWorker();
    const gpuOn = useGpu();
    const m = MODELS.find((x) => x.id === $('model').value);
    const dtype = gpuOn ? { encoder_model: m.f16 ? 'fp16' : 'fp32', decoder_model_merged: 'q4' } : 'q8';
    try {
      for (const k in files) delete files[k];
      $('status').textContent = t('initModel');
      await call({ type: 'load', model: m.id, device: gpuOn ? 'webgpu' : 'wasm', dtype }, null, onLoadProgress);
      const dur = audio.length / SR, t0 = performance.now();
      for (let start = 0; start < dur && running; start += WIN) {
        const end = Math.min(dur, start + WIN);
        $('bar').style.width = ((start / dur) * 100).toFixed(1) + '%';
        $('status').textContent = t('working', { done: clock(start), total: clock(dur) });
        const slice = audio.slice(Math.floor(start * SR), Math.floor(end * SR));
        const { out } = await call({ type: 'run', audio: slice, lang: $('lang').value, task: $('task').value }, [slice.buffer]);
        const chunks = out.chunks && out.chunks.length ? out.chunks : [{ timestamp: [0, end - start], text: out.text || '' }];
        chunks.forEach((c, i) => {
          const s = (c.timestamp[0] ?? 0) + start;
          const next = chunks[i + 1] && chunks[i + 1].timestamp[0];
          const e = (c.timestamp[1] ?? next ?? end - start) + start;
          const text = (c.text || '').trim();
          if (text) segs.push({ start: s, end: Math.min(Math.max(e, s), end), text });
        });
        renderSegs();
      }
      const sec = (performance.now() - t0) / 1000;
      $('bar').style.width = '100%';
      $('status').textContent = t('doneStat', { sec: sec.toFixed(1), x: (dur / sec).toFixed(1) });
    } catch (e) {
      if (running) { $('status').className = 'err'; $('status').textContent = t('failed', { msg: e.message }); }
    } finally {
      running = false;
      $('runBtn').hidden = false; $('stopBtn').hidden = true;
    }
  }

  function renderSegs() {
    $('segCount').textContent = segs.length ? t('segCount', { n: segs.length }) : '';
    $('segs').innerHTML = '';
    segs.forEach((s, i) => {
      const row = document.createElement('div');
      row.className = 'seg';
      row.innerHTML = `<button type="button">${clock(s.start)}</button><span contenteditable="plaintext-only" spellcheck="false"></span>`;
      row.querySelector('span').textContent = s.text;
      row.querySelector('span').addEventListener('input', (e) => { segs[i].text = e.target.textContent; });
      row.querySelector('button').addEventListener('click', () => { $('player').currentTime = s.start; $('player').play().catch(() => {}); });
      $('segs').appendChild(row);
    });
  }

  function exportText(kind) {
    if (kind === 'txt') return segs.map((s) => s.text.trim()).join('\n') + '\n';
    if (kind === 'vtt') return 'WEBVTT\n\n' + segs.map((s) => `${stamp(s.start, '.')} --> ${stamp(s.end, '.')}\n${s.text.trim()}\n`).join('\n');
    return segs.map((s, i) => `${i + 1}\n${stamp(s.start, ',')} --> ${stamp(s.end, ',')}\n${s.text.trim()}\n`).join('\n');
  }
  document.querySelectorAll('[data-dl]').forEach((b) => b.addEventListener('click', () => {
    if (!segs.length) return;
    const kind = b.dataset.dl;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([exportText(kind)], { type: kind === 'vtt' ? 'text/vtt' : 'text/plain' }));
    a.download = `${fileName}.${kind}`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }));
  $('copyTxt').addEventListener('click', () => segs.length && UI.copy(exportText('txt')));

  $('player').addEventListener('timeupdate', () => {
    const ct = $('player').currentTime;
    [...$('segs').children].forEach((el, i) => el.classList.toggle('on', segs[i] && ct >= segs[i].start && ct < segs[i].end));
  });

  const drop = $('drop');
  drop.addEventListener('click', () => $('file').click());
  $('file').addEventListener('change', (e) => e.target.files[0] && loadFile(e.target.files[0]));
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); e.dataTransfer.files[0] && loadFile(e.dataTransfer.files[0]); });

  let rec = null, recTimer = null;
  $('recBtn').addEventListener('click', async () => {
    if (rec) { rec.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const parts = [];
      rec = new MediaRecorder(stream);
      rec.ondataavailable = (e) => e.data.size && parts.push(e.data);
      rec.onstop = () => {
        stream.getTracks().forEach((x) => x.stop());
        clearInterval(recTimer);
        $('recTime').textContent = '';
        $('recBtn').dataset.i18n = 'rec'; $('recBtn').textContent = t('rec');
        const blob = new Blob(parts, { type: rec.mimeType || 'audio/webm' });
        rec = null;
        loadFile(blob, 'recording.' + (blob.type.includes('mp4') ? 'm4a' : 'webm'));
      };
      rec.start();
      const t0 = Date.now();
      recTimer = setInterval(() => { $('recTime').textContent = '● ' + clock((Date.now() - t0) / 1000); }, 250);
      $('recBtn').dataset.i18n = 'recStop'; $('recBtn').textContent = t('recStop');
    } catch (e) {
      $('status').className = 'err';
      $('status').textContent = t('micErr');
    }
  });

  $('runBtn').addEventListener('click', run);
  $('stopBtn').addEventListener('click', () => {
    running = false;
    if (worker) { worker.terminate(); worker = null; }
    $('status').className = 'muted';
    $('status').textContent = t('stopped');
    $('runBtn').hidden = false; $('stopBtn').hidden = true;
  });
  $('forceCpu').addEventListener('change', () => { renderSelects(); savePref(); });
  ['model', 'lang', 'task'].forEach((id) => $(id).addEventListener('change', savePref));
  document.addEventListener('i18n:change', () => { renderSelects(); renderSegs(); });

  if (pref.task) $('task').value = pref.task;
  $('forceCpu').checked = !!pref.cpu;
  renderSelects();
  detectGpu().then(renderSelects);
})();
</script>
