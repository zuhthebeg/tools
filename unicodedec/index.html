      const shown = name || /\p{C}|\p{Z}/u.test(ch) ? `<span class="badge">${esc(name || 'U+' + hex(cp, 4))}</span>` : esc(ch);
      const u8 = [...enc.encode(ch)].map((b) => hex(b, 2)).join(' ');
      const e = cp > 0xFFFF ? [...ch].length && `\\u${hex(ch.charCodeAt(0), 4)}\\u${hex(ch.charCodeAt(1), 4)}` : `\\u${hex(cp, 4)}`;
      return `<tr${bad ? ' class="inv"' : ''}><td class="c">${shown}</td><td class="mono">U+${hex(cp, 4)}</td><td class="mono">${u8}</td><td class="mono">${e}</td><td>${t('k' + kind(ch))}</td></tr>`;
    }).join('') + (chars.length > MAX ? `<tr><td colspan="5" class="muted">${t('more', { n: MAX })}</td></tr>` : '');
  }

  function run() {
    const s = $('input').value;
    $('output').value = '';
    if (!s) { status(null); inspect(''); return; }
    try {
      let out, m = mode, msgs = [];
      if (dir === 'enc') out = ENC[m === 'auto' ? 'unicode' : m](s);
      else if (m === 'auto') {
        out = s;
        const seen = [];
        for (let i = 0; i < 4; i++) {
          const d = detect(out);
          if (!d) break;
          const next = DEC[d](out);
          if (next === out) break;
          seen.push(d); out = next;
        }
        if (seen.length) msgs.push(['detected', { m: seen.map((x) => ({ unicode: '\\u', url: 'URL', html: 'HTML', base64: 'Base64' }[x])).join(' → ') }]);
      } else out = DEC[m](s);
      $('output').value = out;
      if (out === s) status('nothing');
      else status([...msgs, ['done', { a: [...s].length, b: [...out].length }]], null, 'ok');
      inspect(dir === 'enc' ? s : out);
    } catch (e) {
      status('errRaw', null, 'err'); $('status').textContent = e.message; lastStatus = null;
      inspect(s);
    }
  }

  function syncOpts() {
    const key = `${dir}:${mode}`;
    document.querySelectorAll('#opts [data-for]').forEach((el) => { el.hidden = !el.dataset.for.split(' ').includes(key); });
    $('modeSeg').querySelector('[data-m=auto]').hidden = dir === 'enc';
    const list = mode === 'auto' ? Object.values(EX).map((a) => a[0]) : EX[mode];
    $('chips').innerHTML = dir === 'dec' ? list.map((v) => `<button>${esc(v.length > 46 ? v.slice(0, 44) + '…' : v)}</button>`).join('') : '';
    $('chips').dataset.list = JSON.stringify(dir === 'dec' ? list : []);
  }
  function setSeg(seg, attr, val) { [...seg.children].forEach((b) => b.classList.toggle('on', b.dataset[attr] === val)); }

  $('dirSeg').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    dir = b.dataset.d; setSeg($('dirSeg'), 'd', dir);
    if (dir === 'enc' && mode === 'auto') { mode = 'unicode'; setSeg($('modeSeg'), 'm', mode); }
    syncOpts(); run();
  });
  $('modeSeg').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    mode = b.dataset.m; setSeg($('modeSeg'), 'm', mode); syncOpts(); run();
  });
  $('opts').addEventListener('input', run);
  $('input').addEventListener('input', run);
  $('chips').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const list = JSON.parse($('chips').dataset.list || '[]');
    $('input').value = list[[...$('chips').children].indexOf(b)] || ''; run();
  });
  $('copyBtn').addEventListener('click', () => { if ($('output').value) UI.copy($('output').value); });
  $('swapBtn').addEventListener('click', () => {
    if (!$('output').value) return;
    $('input').value = $('output').value;
    dir = dir === 'dec' ? 'enc' : 'dec'; setSeg($('dirSeg'), 'd', dir);
    if (dir === 'enc' && mode === 'auto') { mode = 'unicode'; setSeg($('modeSeg'), 'm', mode); }
    syncOpts(); run();
  });
  $('clearBtn').addEventListener('click', () => { $('input').value = ''; run(); $('input').focus(); });
  $('stripBtn').addEventListener('click', () => {
    const strip = (s) => [...s].filter((ch) => !INV.test(ch) || ch === '\n' || ch === '\t' || ch === '\r').map((ch) => (SPACES.test(ch) ? ' ' : ch)).join('');
    if (dir === 'dec' && $('output').value) { $('input').value = strip($('output').value); mode = 'auto'; setSeg($('modeSeg'), 'm', mode); }
    else $('input').value = strip($('input').value);
    syncOpts(); run();
  });
  document.addEventListener('i18n:change', () => { syncOpts(); run(); });
  syncOpts();
  run();
})();
</script>
