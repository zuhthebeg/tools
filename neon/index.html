<script>
(() => {
  const t = I18n.t;
  I18n.define({
    pageTitle: ['네온사인 전광판 — tool.cocy.io', 'Neon Sign Board — tool.cocy.io', '霓虹灯广告牌 — tool.cocy.io', '霓虹燈看板 — tool.cocy.io', 'Letrero de neón — tool.cocy.io'],
    h1: ['네온사인 전광판', 'Neon Sign Board', '霓虹灯广告牌', '霓虹燈看板', 'Letrero de neón'],
    hide: ['숨기기', 'Hide', '隐藏', '隱藏', 'Ocultar'],
    hideTip: ['패널 숨기기 (화면 탭하면 다시 보임)', 'Hide panel (tap the screen to show it again)', '隐藏面板（点击屏幕重新显示）', '隱藏面板（點擊螢幕重新顯示）', 'Ocultar panel (toca la pantalla para volver a verlo)'],
    text: ['문구', 'Text', '文字', '文字', 'Texto'],
    textPh: ['문구를 입력하세요', 'Type your message', '输入文字', '輸入文字', 'Escribe tu mensaje'],
    color: ['색상', 'Color', '颜色', '顏色', 'Color'],
    custom: ['직접 선택', 'Custom', '自定义', '自訂', 'Personalizado'],
    size: ['크기', 'Size', '大小', '大小', 'Tamaño'],
    font: ['글꼴', 'Font', '字体', '字型', 'Fuente'],
    fontSans: ['기본 고딕', 'Sans-serif', '无衬线', '無襯線', 'Sans serif'],
    fontHand: ['손글씨', 'Handwriting', '手写', '手寫', 'Manuscrita'],
    fontSerif: ['세리프', 'Serif', '衬线', '襯線', 'Serif'],
    fontMono: ['타자기', 'Typewriter', '打字机', '打字機', 'Máquina de escribir'],
    fontImpact: ['임팩트', 'Impact', 'Impact', 'Impact', 'Impact'],
    motion: ['움직임', 'Motion', '动画', '動畫', 'Movimiento'],
    mNone: ['고정', 'Static', '静止', '靜止', 'Fijo'],
    mLeft: ['← 왼쪽으로 흐르기', '← Scroll left', '← 向左滚动', '← 向左捲動', '← Desplazar a la izquierda'],
    mRight: ['→ 오른쪽으로 흐르기', '→ Scroll right', '→ 向右滚动', '→ 向右捲動', '→ Desplazar a la derecha'],
    mUp: ['↑ 위로 흐르기', '↑ Scroll up', '↑ 向上滚动', '↑ 向上捲動', '↑ Desplazar hacia arriba'],
    speed: ['속도', 'Speed', '速度', '速度', 'Velocidad'],
    rainbow: ['레인보우', 'Rainbow', '彩虹', '彩虹', 'Arcoíris'],
    flicker: ['깜빡임', 'Flicker', '闪烁', '閃爍', 'Parpadeo'],
    fs: ['⛶ 전체화면', '⛶ Fullscreen', '⛶ 全屏', '⛶ 全螢幕', '⛶ Pantalla completa'],
    share: ['🔗 링크 공유', '🔗 Share link', '🔗 分享链接', '🔗 分享連結', '🔗 Compartir enlace'],
    note: ['전체화면에선 화면이 꺼지지 않아요. 화면을 탭하면 패널이 다시 나와요.', 'The screen stays on in fullscreen. Tap the screen to bring the panel back.', '全屏时屏幕保持常亮。点击屏幕可重新打开面板。', '全螢幕時螢幕保持常亮。點擊螢幕可重新開啟面板。', 'En pantalla completa la pantalla no se apaga. Toca la pantalla para volver a ver el panel.'],
    defaultText: ['네온사인', 'NEON', '霓虹灯', '霓虹燈', 'NEÓN'],
    tapHint: ['화면을 탭하면 설정이 열려요', 'Tap the screen to open settings', '点击屏幕打开设置', '點擊螢幕開啟設定', 'Toca la pantalla para abrir los ajustes'],
    shareCopied: ['공유 링크를 복사했어요', 'Share link copied', '已复制分享链接', '已複製分享連結', 'Enlace copiado'],
  });
  const PRESETS = {
    ko: ['생일 축하해 🎉', '사랑해 ❤️', '파이팅!', 'WELCOME', '택시!', '공연 최고 👏'],
    en: ['Happy Birthday 🎉', 'I ❤️ YOU', 'GO GO GO!', 'WELCOME', 'TAXI!', 'Best show ever 👏'],
    'zh-CN': ['生日快乐 🎉', '我爱你 ❤️', '加油！', 'WELCOME', '出租车！', '演出太棒了 👏'],
    'zh-TW': ['生日快樂 🎉', '我愛你 ❤️', '加油！', 'WELCOME', '計程車！', '演出太棒了 👏'],
    es: ['¡Feliz cumpleaños! 🎉', 'Te quiero ❤️', '¡Vamos!', 'BIENVENIDOS', '¡TAXI!', '¡Gran show! 👏'],
  };
  I18n.init();

  const $ = (id) => document.getElementById(id);
  const COLORS = ['#00ffff', '#ff2bd6', '#39ff14', '#ffe600', '#ff3131', '#7a5cff', '#ffffff'];
  const KEY = 'neon_options_v2';
  const def = { text: '', color: '#00ffff', size: 6, font: 'system-ui', motion: 'none', speed: 5, rainbow: false, flicker: false };
  let s = { ...def };
  try { Object.assign(s, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
  const q = new URLSearchParams(location.search);
  if (q.has('t')) {
    s.text = q.get('t');
    if (/^#?[0-9a-f]{6}$/i.test(q.get('c') || '')) s.color = '#' + q.get('c').replace('#', '');
    if (q.get('s')) s.size = Math.min(30, Math.max(2, +q.get('s') || 6));
    if (['none', 'left', 'right', 'up'].includes(q.get('m'))) s.motion = q.get('m');
    if (q.get('v')) s.speed = Math.min(10, Math.max(1, +q.get('v') || 5));
    s.rainbow = q.get('r') === '1';
    s.flicker = q.get('f') === '1';
  }

  const stage = $('stage'), neon = $('neon'), panel = $('panel');
  const ctl = { text: $('text'), size: $('size'), font: $('font'), motion: $('motion'), speed: $('speed'), rainbow: $('rainbow'), flicker: $('flicker') };

  function renderPresets() {
    $('presets').innerHTML = '';
    (PRESETS[I18n.lang] || PRESETS.en).forEach((p) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = p;
      $('presets').appendChild(b);
    });
  }
  renderPresets();
  $('presets').addEventListener('click', (e) => { if (e.target.tagName === 'BUTTON') { s.text = e.target.textContent; ctl.text.value = s.text; apply(); } });
  $('swatches').innerHTML = COLORS.map((c) => `<button type="button" data-c="${c}" style="background:${c}" aria-label="${c}"></button>`).join('') + '<input type="color" id="custom" data-i18n-attr="aria-label:custom">';
  I18n.apply($('swatches'));
  $('swatches').addEventListener('click', (e) => { const c = e.target.dataset && e.target.dataset.c; if (c) { s.color = c; apply(); } });
  $('custom').addEventListener('input', (e) => { s.color = e.target.value; apply(); });

  function apply() {
    neon.textContent = s.text || t('defaultText');
    stage.style.setProperty('--c', s.color);
    stage.style.setProperty('--size', s.size + 'rem');
    stage.style.setProperty('--font', s.font);
    stage.style.setProperty('--spd', (22 - s.speed * 2) + 's');
    stage.className = (s.motion !== 'none' ? 'm-' + s.motion : '') + (s.rainbow ? ' rainbow' : '') + (s.flicker ? ' flicker' : '');
    $('sizeVal').textContent = s.size + 'rem';
    $('speedField').hidden = s.motion === 'none';
    $('swatches').querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.c === s.color));
    $('custom').value = s.color;
    try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
  }
  function sync() {
    ctl.text.value = s.text; ctl.size.value = s.size; ctl.font.value = s.font; ctl.motion.value = s.motion;
    ctl.speed.value = s.speed; ctl.rainbow.checked = s.rainbow; ctl.flicker.checked = s.flicker;
  }
  ctl.text.addEventListener('input', () => { s.text = ctl.text.value; apply(); });
  ctl.size.addEventListener('input', () => { s.size = +ctl.size.value; apply(); });
  ctl.speed.addEventListener('input', () => { s.speed = +ctl.speed.value; apply(); });
  ctl.font.addEventListener('change', () => { s.font = ctl.font.value; apply(); });
  ctl.motion.addEventListener('change', () => { s.motion = ctl.motion.value; apply(); });
  ctl.rainbow.addEventListener('change', () => { s.rainbow = ctl.rainbow.checked; apply(); });
  ctl.flicker.addEventListener('change', () => { s.flicker = ctl.flicker.checked; apply(); });

  const hint = $('hint');
  function hidePanel() { panel.classList.add('hide'); hint.textContent = t('tapHint'); hint.style.opacity = 1; setTimeout(() => (hint.style.opacity = 0), 2000); }
  function showPanel() { panel.classList.remove('hide'); hint.style.opacity = 0; }
  $('hideBtn').addEventListener('click', hidePanel);
  stage.addEventListener('click', () => (panel.classList.contains('hide') ? showPanel() : hidePanel()));

  let wakeLock = null;
  async function lockScreen() { try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && document.fullscreenElement) lockScreen(); });
  $('fsBtn').addEventListener('click', async () => {
    try { await document.documentElement.requestFullscreen(); } catch (e) {}
    try { await screen.orientation.lock('landscape'); } catch (e) {}
    lockScreen();
    hidePanel();
  });
  document.addEventListener('fullscreenchange', () => {
    const nav = document.getElementById('tnav-btn');
    if (nav) nav.style.display = document.fullscreenElement ? 'none' : '';
    if (!document.fullscreenElement && wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  });

  $('shareBtn').addEventListener('click', async () => {
    const p = new URLSearchParams({ t: s.text || t('defaultText'), c: s.color.replace('#', ''), s: s.size, m: s.motion, v: s.speed });
    if (s.rainbow) p.set('r', '1');
    if (s.flicker) p.set('f', '1');
    const url = `${location.origin}${location.pathname}?${p}`;
    if (navigator.share && /Mobi/i.test(navigator.userAgent)) { try { await navigator.share({ title: t('h1'), url }); return; } catch (e) {} }
    UI.copy(url, t('shareCopied'));
  });
  document.addEventListener('i18n:change', () => { renderPresets(); apply(); });

  sync(); apply();
  if (q.has('t')) hidePanel();
})();
</script>

});
</script>
