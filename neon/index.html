<style>
html, body { height: 100%; overflow: hidden; background: #000; }
#stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; }
.wrapper { display: inline-block; white-space: nowrap; will-change: transform; }
#neon { display: inline-block; font-weight: 800; font-size: var(--size, 6rem); color: #fff; font-family: var(--font, system-ui);
  text-shadow: 0 0 8px #fff, 0 0 18px var(--c, #0ff), 0 0 32px var(--c, #0ff), 0 0 64px var(--c, #0ff), 0 0 100px var(--c, #0ff); }
.flicker #neon { animation: flicker 4s infinite; }
.rainbow #neon { animation: rainbow var(--rspd, 4s) linear infinite; }
.flicker.rainbow #neon { animation: rainbow var(--rspd, 4s) linear infinite, flicker 4s infinite; }
@keyframes flicker { 0%,96%,100%{opacity:1} 97%{opacity:.35} 98%{opacity:1} 99%{opacity:.5} }
@keyframes rainbow { 0%{filter:hue-rotate(0deg)} 100%{filter:hue-rotate(360deg)} }
.m-left .wrapper { animation: mLeft var(--spd, 10s) linear infinite; }
.m-right .wrapper { animation: mRight var(--spd, 10s) linear infinite; }
.m-up .wrapper { animation: mUp var(--spd, 10s) linear infinite; }
@keyframes mLeft { from { transform: translateX(100vw); } to { transform: translateX(-100%); } }
@keyframes mRight { from { transform: translateX(-100%); } to { transform: translateX(100vw); } }
@keyframes mUp { from { transform: translateY(100vh); } to { transform: translateY(-100%); } }
#panel { position: fixed; top: 12px; left: 12px; width: min(320px, calc(100vw - 24px)); max-height: calc(100vh - 24px); overflow: auto; z-index: 10; background: rgba(15, 23, 42, .92); backdrop-filter: blur(6px); transition: opacity .25s, transform .25s; margin: 0; }
#panel.hide { opacity: 0; transform: translateY(-12px); pointer-events: none; }
#panel .field { margin-bottom: 12px; }
#panel input[type=range] { width: 100%; accent-color: var(--primary); }
.presets { display: flex; gap: 6px; flex-wrap: wrap; }
.presets button { border: 1px solid var(--line); background: var(--panel-2); color: var(--text); border-radius: 999px; padding: 5px 10px; font-size: 13px; cursor: pointer; font-family: inherit; }
.swatches { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.swatches button { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
.swatches button.on { border-color: #fff; }
.swatches input[type=color] { width: 34px; height: 30px; padding: 0; border: 0; background: none; }
#hint { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,.5); font-size: 13px; z-index: 5; pointer-events: none; transition: opacity .3s; }
#tnav-btn { opacity: .5; }
</style>

<body>
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MV8KQGJF" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<div id="stage"><div class="wrapper"><div id="neon">네온사인</div></div></div>
<div id="panel" class="card">
  <h2>✨ 네온사인 전광판 <button class="btn sm" id="hideBtn" title="패널 숨기기 (화면 탭하면 다시 보임)">숨기기</button></h2>
  <div class="field"><label class="lbl" for="text">문구</label><input type="text" id="text" maxlength="200" placeholder="문구를 입력하세요"></div>
  <div class="field"><div class="presets" id="presets"></div></div>
  <div class="field"><label class="lbl">색상</label><div class="swatches" id="swatches"></div></div>
  <div class="field"><label class="lbl" for="size">크기 <span id="sizeVal"></span></label><input type="range" id="size" min="2" max="30" step="0.5"></div>
  <div class="field"><label class="lbl" for="font">글꼴</label>
    <select id="font"><option value="system-ui">기본 고딕</option><option value="'Nanum Pen Script', cursive">손글씨</option><option value="Georgia, serif">세리프</option><option value="'Courier New', monospace">타자기</option><option value="Impact, sans-serif">임팩트</option></select></div>
  <div class="field"><label class="lbl" for="motion">움직임</label>
    <select id="motion"><option value="none">고정</option><option value="left">← 왼쪽으로 흐르기</option><option value="right">→ 오른쪽으로 흐르기</option><option value="up">↑ 위로 흐르기</option></select></div>
  <div class="field" id="speedField"><label class="lbl" for="speed">속도</label><input type="range" id="speed" min="1" max="10" step="1"></div>
  <div class="field row"><label class="chk"><input type="checkbox" id="rainbow"> 레인보우</label><label class="chk"><input type="checkbox" id="flicker"> 깜빡임</label></div>
  <div class="row">
    <button class="btn primary grow" id="fsBtn">⛶ 전체화면</button>
    <button class="btn" id="shareBtn">🔗 링크 공유</button>
  </div>
  <p class="muted" style="margin:10px 0 0">전체화면에선 화면이 꺼지지 않아요. 화면을 탭하면 패널이 다시 나와요.</p>
</div>
<div id="hint"></div>
<script src="/lib/ui.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const COLORS = ['#00ffff', '#ff2bd6', '#39ff14', '#ffe600', '#ff3131', '#7a5cff', '#ffffff'];
  const PRESETS = ['생일 축하해 🎉', '사랑해 ❤️', '파이팅!', 'WELCOME', '택시!', '공연 최고 👏'];
  const KEY = 'neon_options_v2';
  const def = { text: '', color: '#00ffff', size: 6, font: 'system-ui', motion: 'none', speed: 5, rainbow: false, flicker: false };
  let s = { ...def };
  try { Object.assign(s, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
  const q = new URLSearchParams(location.search);
  if (q.has('t')) {
    s.text = q.get('t');
    if (/^#?[0-9a-f]{6}$/i.test(q.get('c') || '')) s.color = '#' + q.get('c').replace('#', '');
    if (q.get('s')) s.size = Math.min(30, Math.max(2, +q.get('s') || 6));
    if (['none', 'left', 'right', 'up'].includes(q.get('m'))) s.motion = q.get('m');
    if (q.get('v')) s.speed = Math.min(10, Math.max(1, +q.get('v') || 5));
    s.rainbow = q.get('r') === '1';
    s.flicker = q.get('f') === '1';
  }

  const stage = $('stage'), neon = $('neon'), panel = $('panel');
  const ctl = { text: $('text'), size: $('size'), font: $('font'), motion: $('motion'), speed: $('speed'), rainbow: $('rainbow'), flicker: $('flicker') };

  $('presets').innerHTML = PRESETS.map((p) => `<button type="button">${p}</button>`).join('');
  $('presets').addEventListener('click', (e) => { if (e.target.tagName === 'BUTTON') { s.text = e.target.textContent; ctl.text.value = s.text; apply(); } });
  $('swatches').innerHTML = COLORS.map((c) => `<button type="button" data-c="${c}" style="background:${c}" aria-label="${c}"></button>`).join('') + '<input type="color" id="custom" aria-label="직접 선택">';
  $('swatches').addEventListener('click', (e) => { const c = e.target.dataset && e.target.dataset.c; if (c) { s.color = c; apply(); } });
  $('custom').addEventListener('input', (e) => { s.color = e.target.value; apply(); });

  function apply() {
    neon.textContent = s.text || '네온사인';
    stage.style.setProperty('--c', s.color);
    stage.style.setProperty('--size', s.size + 'rem');
    stage.style.setProperty('--font', s.font);
    stage.style.setProperty('--spd', (22 - s.speed * 2) + 's');
    stage.className = (s.motion !== 'none' ? 'm-' + s.motion : '') + (s.rainbow ? ' rainbow' : '') + (s.flicker ? ' flicker' : '');
    $('sizeVal').textContent = s.size + 'rem';
    $('speedField').hidden = s.motion === 'none';
    $('swatches').querySelectorAll('button').forEach((b) => b.classList.toggle('on', b.dataset.c === s.color));
    $('custom').value = s.color;
    try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
  }
  function sync() {
    ctl.text.value = s.text; ctl.size.value = s.size; ctl.font.value = s.font; ctl.motion.value = s.motion;
    ctl.speed.value = s.speed; ctl.rainbow.checked = s.rainbow; ctl.flicker.checked = s.flicker;
  }
  ctl.text.addEventListener('input', () => { s.text = ctl.text.value; apply(); });
  ctl.size.addEventListener('input', () => { s.size = +ctl.size.value; apply(); });
  ctl.speed.addEventListener('input', () => { s.speed = +ctl.speed.value; apply(); });
  ctl.font.addEventListener('change', () => { s.font = ctl.font.value; apply(); });
  ctl.motion.addEventListener('change', () => { s.motion = ctl.motion.value; apply(); });
  ctl.rainbow.addEventListener('change', () => { s.rainbow = ctl.rainbow.checked; apply(); });
  ctl.flicker.addEventListener('change', () => { s.flicker = ctl.flicker.checked; apply(); });

  const hint = $('hint');
  function hidePanel() { panel.classList.add('hide'); hint.textContent = '화면을 탭하면 설정이 열려요'; hint.style.opacity = 1; setTimeout(() => (hint.style.opacity = 0), 2000); }
  function showPanel() { panel.classList.remove('hide'); hint.style.opacity = 0; }
  $('hideBtn').addEventListener('click', hidePanel);
  stage.addEventListener('click', () => (panel.classList.contains('hide') ? showPanel() : hidePanel()));

  let wakeLock = null;
  async function lockScreen() { try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && document.fullscreenElement) lockScreen(); });
  $('fsBtn').addEventListener('click', async () => {
    try { await document.documentElement.requestFullscreen(); } catch (e) {}
    try { await screen.orientation.lock('landscape'); } catch (e) {}
    lockScreen();
    hidePanel();
  });
  document.addEventListener('fullscreenchange', () => {
    const nav = document.getElementById('tnav-btn');
    if (nav) nav.style.display = document.fullscreenElement ? 'none' : '';
    if (!document.fullscreenElement && wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  });

  $('shareBtn').addEventListener('click', async () => {
    const p = new URLSearchParams({ t: s.text || '네온사인', c: s.color.replace('#', ''), s: s.size, m: s.motion, v: s.speed });
    if (s.rainbow) p.set('r', '1');
    if (s.flicker) p.set('f', '1');
    const url = `${location.origin}${location.pathname}?${p}`;
    if (navigator.share && /Mobi/i.test(navigator.userAgent)) { try { await navigator.share({ title: '네온사인', url }); return; } catch (e) {} }
    UI.copy(url, '공유 링크를 복사했어요');
  });

  sync(); apply();
  if (q.has('t')) hidePanel();
})();
</script>
