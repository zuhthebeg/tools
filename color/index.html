<script>
(() => {
  const t = I18n.t;
  I18n.define({
    pageTitle: ['색상 변환기 · 팔레트 · 명도 대비 — tool.cocy.io', 'Color Converter · Palette · Contrast Checker — tool.cocy.io', '颜色转换器 · 配色 · 对比度检查 — tool.cocy.io', '顏色轉換器 · 配色 · 對比度檢查 — tool.cocy.io', 'Conversor de color · Paleta · Contraste — tool.cocy.io'],
    h1: ['색상 변환기 · 팔레트', 'Color Converter · Palette', '颜色转换器 · 配色', '顏色轉換器 · 配色', 'Conversor de color · Paleta'],
    sub: ['HEX · RGB · HSL 변환 · 배색 팔레트 · 명도 대비(WCAG) 검사 — 색 클릭하면 복사', 'HEX · RGB · HSL conversion · color palettes · WCAG contrast check — click a color to copy', 'HEX · RGB · HSL 转换 · 配色方案 · WCAG 对比度检查 — 点击颜色复制', 'HEX · RGB · HSL 轉換 · 配色方案 · WCAG 對比度檢查 — 點擊顏色複製', 'Conversión HEX · RGB · HSL · paletas · contraste WCAG — clic en un color para copiar'],
    pickTip: ['클릭해서 색 고르기', 'Click to pick a color', '点击选择颜色', '點擊選擇顏色', 'Clic para elegir color'],
    pick: ['클릭해서 선택', 'Click to pick', '点击选择', '點擊選擇', 'Clic para elegir'],
    copy: ['복사', 'Copy', '复制', '複製', 'Copiar'],
    rand: ['🎲 랜덤', '🎲 Random', '🎲 随机', '🎲 隨機', '🎲 Aleatorio'],
    eye: ['💧 화면에서 추출', '💧 Pick from screen', '💧 屏幕取色', '💧 螢幕取色', '💧 Tomar de la pantalla'],
    badFmt: ['형식을 확인해 주세요', 'Check the format', '请检查格式', '請檢查格式', 'Revisa el formato'],
    palette: ['팔레트', 'Palettes', '配色', '配色', 'Paletas'],
    pShades: ['명암 단계 (Shades)', 'Shades', '明暗阶梯', '明暗階梯', 'Tonos'],
    pComp: ['보색 (Complementary)', 'Complementary', '互补色', '互補色', 'Complementarios'],
    pAna: ['유사색 (Analogous)', 'Analogous', '类似色', '類似色', 'Análogos'],
    pTri: ['삼각 배색 (Triadic)', 'Triadic', '三角配色', '三角配色', 'Tríada'],
    pSplit: ['분할 보색 (Split)', 'Split complementary', '分裂互补', '分裂互補', 'Complementario dividido'],
    pTet: ['사각 배색 (Tetradic)', 'Tetradic', '四角配色', '四角配色', 'Tétrada'],
    copyHex: ['{hx} 복사', 'Copied {hx}', '已复制 {hx}', '已複製 {hx}', 'Copiado {hx}'],
    contrast: ['명도 대비 검사 (WCAG 2.1)', 'Contrast checker (WCAG 2.1)', '对比度检查（WCAG 2.1）', '對比度檢查（WCAG 2.1）', 'Comprobador de contraste (WCAG 2.1)'],
    fgL: ['글자색', 'Text color', '文字颜色', '文字顏色', 'Color del texto'],
    bgL: ['배경색', 'Background', '背景色', '背景色', 'Fondo'],
    useFg: ['위 색을 글자색으로', 'Use above as text', '将上方颜色设为文字色', '將上方顏色設為文字色', 'Usar como texto'],
    useBg: ['위 색을 배경색으로', 'Use above as background', '将上方颜色设为背景色', '將上方顏色設為背景色', 'Usar como fondo'],
    swap: ['⇄ 바꾸기', '⇄ Swap', '⇄ 交换', '⇄ 交換', '⇄ Intercambiar'],
    sampleL: ['큰 글씨 미리보기 Aa', 'Large text preview Aa', '大号文字预览 Aa', '大字預覽 Aa', 'Vista previa de texto grande Aa'],
    sampleS: ['작은 본문 글씨는 4.5:1 이상의 대비가 필요해요. The quick brown fox.', 'Small body text needs a contrast of at least 4.5:1. The quick brown fox.', '小号正文需要至少 4.5:1 的对比度。The quick brown fox.', '小字內文需要至少 4.5:1 的對比度。The quick brown fox.', 'El texto pequeño necesita un contraste de al menos 4.5:1. The quick brown fox.'],
    body: ['본문', 'body text', '正文', '內文', 'texto normal'],
    large: ['큰 글씨', 'large text', '大号文字', '大字', 'texto grande'],
    ui: ['UI 요소', 'UI components', 'UI 组件', 'UI 元件', 'Componentes UI'],
  });
  I18n.init();
  const $ = (id) => document.getElementById(id);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const hex2rgb = (h) => { h = h.replace('#', ''); if (h.length === 3) h = [...h].map((c) => c + c).join(''); const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
  const rgb2hex = (r, g, b) => '#' + [r, g, b].map((v) => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('').toUpperCase();
  function rgb2hsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
    let h = 0, s = 0;
    if (mx !== mn) {
      const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
      h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60;
    }
    return [Math.round(h), Math.round(s * 100), Math.round(l * 100)];
  }
  function hsl2rgb(h, s, l) {
    h = ((h % 360) + 360) % 360; s = clamp(s, 0, 100) / 100; l = clamp(l, 0, 100) / 100;
    const k = (n) => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
    const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
    return [f(0) * 255, f(8) * 255, f(4) * 255].map(Math.round);
  }
  function parseColor(str) {
    const s = str.trim().toLowerCase();
    let m;
    if ((m = s.match(/^#?([0-9a-f]{3}|[0-9a-f]{6})$/))) return hex2rgb(m[1]);
    if ((m = s.match(/^rgba?\(?\s*(\d{1,3})[\s,]+(\d{1,3})[\s,]+(\d{1,3})/))) return [+m[1], +m[2], +m[3]].map((v) => clamp(v, 0, 255));
    if ((m = s.match(/^hsla?\(?\s*(-?\d+(?:\.\d+)?)(?:deg)?[\s,]+(\d+(?:\.\d+)?)%?[\s,]+(\d+(?:\.\d+)?)%?/))) return hsl2rgb(+m[1], +m[2], +m[3]);
    return null;
  }
  const lum = ([r, g, b]) => { const c = [r, g, b].map((v) => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; };
  const ratio = (a, b) => { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); };
  const textOn = (rgb) => (lum(rgb) > .4 ? '#0f172a' : '#ffffff');

  let main = [59, 130, 246];
  function setMain(rgb, from) {
    main = rgb;
    const hex = rgb2hex(...rgb), hsl = rgb2hsl(...rgb);
    if (from !== 'hex') $('hex').value = hex;
    if (from !== 'rgb') $('rgb').value = `rgb(${rgb.join(', ')})`;
    if (from !== 'hsl') $('hsl').value = `hsl(${hsl[0]}, ${hsl[1]}%, ${hsl[2]}%)`;
    $('picker').value = hex.toLowerCase();
    $('preview').style.background = hex;
    $('pvLabel').style.color = textOn(rgb);
    $('err').textContent = '';
    localStorage.setItem('color_last', hex);
    history.replaceState(null, '', '#' + hex.slice(1));
    palette(hsl);
  }
  ['hex', 'rgb', 'hsl'].forEach((id) => $(id).addEventListener('input', () => {
    const c = parseColor($(id).value);
    if (c) setMain(c, id); else $('err').textContent = t('badFmt');
  }));
  $('picker').addEventListener('input', () => setMain(hex2rgb($('picker').value)));
  document.querySelectorAll('[data-copy]').forEach((b) => b.addEventListener('click', () => UI.copy($(b.dataset.copy).value)));
  $('randBtn').addEventListener('click', () => setMain(hsl2rgb(Math.random() * 360, 55 + Math.random() * 35, 40 + Math.random() * 25)));
  if ('EyeDropper' in window) {
    $('eyeBtn').hidden = false;
    $('eyeBtn').addEventListener('click', async () => { try { const r = await new EyeDropper().open(); setMain(hex2rgb(r.sRGBHex)); } catch (e) {} });
  }

  function palette([h, s, l]) {
    const groups = [
      [t('pShades'), [95, 85, 72, 60, 50, 40, 30, 20, 12].map((L) => [h, s, L])],
      [t('pComp'), [[h, s, l], [h + 180, s, l]]],
      [t('pAna'), [[h - 30, s, l], [h - 15, s, l], [h, s, l], [h + 15, s, l], [h + 30, s, l]]],
      [t('pTri'), [[h, s, l], [h + 120, s, l], [h + 240, s, l]]],
      [t('pSplit'), [[h, s, l], [h + 150, s, l], [h + 210, s, l]]],
      [t('pTet'), [[h, s, l], [h + 90, s, l], [h + 180, s, l], [h + 270, s, l]]],
    ];
    $('pal').innerHTML = groups.map(([name, cols]) => `<div><h3>${name}</h3><div class="sw">${cols.map((c) => { const rgb = hsl2rgb(...c), hx = rgb2hex(...rgb); return `<div data-hex="${hx}" style="background:${hx};color:${textOn(rgb)}" title="${t('copyHex', { hx })}">${hx}</div>`; }).join('')}</div></div>`).join('');
  }
  $('pal').addEventListener('click', (e) => { const hx = e.target.dataset.hex; if (hx) UI.copy(hx, t('copyHex', { hx })); });
  $('pal').addEventListener('dblclick', (e) => { const hx = e.target.dataset.hex; if (hx) setMain(hex2rgb(hx)); });

  let fg = [255, 255, 255], bg = [59, 130, 246];
  function contrast(from) {
    const fh = rgb2hex(...fg), bh = rgb2hex(...bg);
    if (from !== 'fg') $('fg').value = fh;
    if (from !== 'bg') $('bg').value = bh;
    $('fgPick').value = fh.toLowerCase(); $('bgPick').value = bh.toLowerCase();
    $('sample').style.cssText = `background:${bh};color:${fh}`;
    const r = ratio(fg, bg);
    $('ratio').textContent = (Math.floor(r * 100) / 100).toFixed(2);
    const levels = [['AA ' + t('body'), 4.5], ['AA ' + t('large'), 3], ['AAA ' + t('body'), 7], ['AAA ' + t('large'), 4.5], [t('ui'), 3]];
    $('badges').innerHTML = levels.map(([n, min]) => `<span class="badge ${r >= min ? 'pass' : 'fail'}">${r >= min ? '✓' : '✗'} ${n} (${min}:1)</span>`).join('');
  }
  $('fg').addEventListener('input', () => { const c = parseColor($('fg').value); if (c) { fg = c; contrast('fg'); } });
  $('bg').addEventListener('input', () => { const c = parseColor($('bg').value); if (c) { bg = c; contrast('bg'); } });
  $('fgPick').addEventListener('input', () => { fg = hex2rgb($('fgPick').value); contrast(); });
  $('bgPick').addEventListener('input', () => { bg = hex2rgb($('bgPick').value); contrast(); });
  $('useMainFg').addEventListener('click', () => { fg = main; contrast(); });
  $('useMainBg').addEventListener('click', () => { bg = main; contrast(); });
  $('swapC').addEventListener('click', () => { [fg, bg] = [bg, fg]; contrast(); });

  const init = parseColor(location.hash.slice(1)) || parseColor(localStorage.getItem('color_last') || '') || main;
  setMain(init);
  bg = init; fg = hex2rgb(textOn(init));
  contrast();
  document.addEventListener('i18n:change', () => { palette(rgb2hsl(...main)); contrast(); });
})();
</script>
